<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農業相談会スライド（藤原美智子さん）</title>
<style>
  :root{ --green:#2e7d32; --green-d:#1b5e20; --ink:#12200f; --paper:#f6f8f3; --gold:#b8892b; --line:#dfe6d8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#0e1410;color:var(--ink);overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{background:#0e1410;}
  .slide{display:none;width:1600px;height:900px;flex:0 0 auto;padding:81.0px 6%;flex-direction:column;justify-content:center;box-shadow:0 0 40px rgba(0,0,0,.5);
         position:relative;background-color:var(--paper);
         background-image:linear-gradient(100deg,
             rgba(246,248,243,.98) 0%, rgba(246,248,243,.96) 48%,
             rgba(246,248,243,.97) 74%, rgba(246,248,243,.94) 100%),
           url('bg-content.jpg');
         background-size:cover;background-position:center right;}
  .slide.active{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{color:var(--green-d);font-weight:800;font-size:40.5px;letter-spacing:.12em;margin-bottom:35.1px;}
  h1{font-size:113.4px;line-height:1.22;color:var(--green-d);font-weight:900;letter-spacing:.01em;}
  h2{font-size:89.1px;line-height:1.28;color:var(--green-d);font-weight:900;}
  .sub{font-size:62.1px;line-height:1.55;margin-top:45.9px;color:#12200f;font-weight:600;max-width:40ch;}
  ul.pts{margin-top:48.6px;list-style:none;display:flex;flex-direction:column;gap:35.1px;}
  ul.pts li{font-size:64.8px;line-height:1.4;font-weight:700;padding-left:1.4em;position:relative;color:#12200f;}
  ul.pts li::before{content:"";position:absolute;left:0;top:.5em;width:.55em;height:.55em;border-radius:50%;background:var(--gold);}
  .quote{font-size:59.4px;line-height:1.6;color:#12200f;font-weight:600;max-width:38ch;margin-top:35.1px;
         border-left:10.8px solid var(--green);padding:13.5px 0 13.5px 48.0px;background:#fff;border-radius:0 12px 12px 0;
         box-shadow:0 6px 24px rgba(30,60,25,.08);padding-right:48.0px;padding-top:35.1px;padding-bottom:35.1px;}
  .who{margin-top:32.4px;font-size:45.9px;color:var(--gold);font-weight:800;}
  .big{font-size:135.0px;color:var(--green-d);font-weight:900;}
  .price{font-size:175.5px;color:var(--green-d);font-weight:900;letter-spacing:.02em;}
  /* 核心の悩み 見える化 */
  .worrycore{margin-top:29.7px;font-size:86.4px;line-height:1.25;color:var(--green-d);font-weight:900;
             background:#fff;border-left:13.5px solid var(--gold);border-radius:0 14px 14px 0;
             padding:32.4px 48.0px;box-shadow:0 8px 28px rgba(30,60,25,.10);max-width:34ch;}
  .worrycards{display:flex;gap:32.0px;margin-top:45.9px;flex-wrap:wrap;max-width:58ch;}
  .wcard{flex:1 1 0;min-width:297.0px;background:#fff;border:4.0px solid var(--line);border-radius:16px;
         padding:29.7px 25.6px;box-shadow:0 6px 20px rgba(30,60,25,.07);}
  .wcard.on{background:#eef6ea;border-color:var(--green);}
  .wc-h{font-size:40.5px;font-weight:800;color:var(--gold);letter-spacing:.04em;margin-bottom:16.2px;}
  .wcard.on .wc-h{color:var(--green-d);}
  .wc-b{font-size:48.6px;line-height:1.4;font-weight:700;color:#12200f;}
  .wc-b b{color:var(--green-d);}
  .cover{background-image:linear-gradient(100deg,
             rgba(247,250,244,.93) 0%, rgba(247,250,244,.88) 40%,
             rgba(247,250,244,.95) 72%, rgba(247,250,244,.90) 100%),
           url('bg-cover.jpg');
         background-size:cover;background-position:center right;color:var(--ink);
         border-top:16.2px solid var(--green-d);}
  .cover h1{color:var(--green-d);font-size:121.5px;text-shadow:none;}
  .cover .sub{color:#33422f;}
  .cover .kicker{color:var(--green);}
  .cover .tag{background:var(--green-d);color:#fff;box-shadow:0 6px 20px rgba(27,60,25,.22);}
  .tag{display:inline-block;background:#fff;color:var(--green-d);font-weight:800;border-radius:999px;
       padding:17.6px 48.0px;font-size:48.6px;margin-top:54.0px;}
  .foot{display:none;}
  #counter{position:fixed;right:38.4px;bottom:32.4px;font-size:40.5px;font-weight:700;color:#2e7d32;background:rgba(255,255,255,.85);
           padding:10.8px 28.8px;border-radius:999px;z-index:20;}
  /* presenter notes: hidden by default, toggle with N. Warn: do not toggle while screen-sharing. */
  #note{position:fixed;left:0;right:0;bottom:0;background:#12241a;color:#eafff0;padding:32.4px 128.0px;
        font-size:40.5px;line-height:1.6;display:none;z-index:30;border-top:6.8px solid var(--gold);max-height:594.0px;overflow:auto;}
  #note.show{display:block;}
  #note b{color:var(--gold);}
  #hint{display:none;}
  .warn{position:absolute;top:40.5px;right:128.0px;font-size:37.8px;color:#b8892b;font-weight:800;}

  /* ★スマホ版で足した分 */
  #stage{overflow:hidden;}
  .slide{overflow:hidden;}
  .slide.active{animation:none !important;}
  body{-webkit-text-size-adjust:100%;}
</style>
<!-- ▼ここから下は「前回の方の版で足した1枚」＝見本(前の回の方版)のCSSは1文字も変えていない -->
<style>
  .qbig{margin-top:2.6vh;font-size:8.6vh;line-height:1.25;color:var(--green-d);font-weight:900;letter-spacing:.02em;white-space:nowrap;}
  .qbig.xl{font-size:13vh;}
  .qbig .q{color:var(--gold);}
  /* 3枚のカードを1列に収める（この1枚ぶんの上書き。見本のCSSは触っていない） */
  .worrycards{max-width:none;width:78%;flex-wrap:nowrap;}
  .wcard{min-width:0;}
  .steps{display:flex;gap:1.6vw;align-items:flex-end;margin-top:3.6vh;width:76%;}
  .step{flex:1 1 0;background:#fff;border:.3vh solid var(--line);border-radius:14px;padding:1.6vh 1vw;
        box-shadow:0 6px 20px rgba(30,60,25,.07);display:flex;flex-direction:column;justify-content:center;text-align:center;}
  .step .n{font-size:2.8vh;color:var(--gold);font-weight:800;letter-spacing:.06em;}
  .step .v{font-size:4.2vh;font-weight:900;color:var(--green-d);margin-top:1vh;line-height:1.3;}
  .step.s1{height:18vh;} .step.s2{height:25vh;} .step.s3{height:32vh;} .step.s4{height:39vh;background:#eef6ea;border-color:var(--green);}
  .note-in{margin-top:2.4vh;font-size:3.2vh;color:#4a5a46;font-weight:700;}
</style>

<style>
/* ★2026-08-18 足した分＝この4つの指定が 元の紙に1つも無く、
   「300万のやる順番」「安定＝？＋？」「僕の答え」「いくらだと思いますか」の4枚が
   飾りの無い ただの行で出ていた。見本の css は さわらず ここで足す。 */
.steps{display:flex;gap:20.0px;margin-top:29.7px;flex-wrap:wrap;width:100%;}
.step{flex:1 1 0;min-width:260.0px;background:#fff;border:4.0px solid var(--line);border-radius:16px;
      padding:20.0px 20.0px;box-shadow:0 6px 20px rgba(30,60,25,.07);}
.step .n{font-size:35.0px;font-weight:800;color:var(--gold);letter-spacing:.04em;margin-bottom:11.0px;}
.step .v{font-size:39.0px;line-height:1.3;font-weight:800;color:var(--green-d);}
.step.s4{background:#eef6ea;border-color:var(--green);}
.step.s4 .n{color:var(--green-d);}
.qbig{margin-top:37.8px;font-size:86.4px;font-weight:900;color:var(--green-d);line-height:1.32;}
.qbig.xl{font-size:94.0px;}
.qbig .q{display:inline-block;background:#fff;border:5.0px solid var(--gold);border-radius:18px;
         padding:6.0px 30.0px;color:var(--green-d);}
.note-in{margin-top:29.7px;font-size:43.0px;color:#42513e;font-weight:700;line-height:1.45;}
/* 出典＝小さく・でも読める大きさで（数字を出したら必ず出どころを同じ画面に置く） */
.deta{margin-top:14.0px;font-size:26.0px;color:#5a6856;font-weight:700;line-height:1.35;word-break:break-all;}
/* ★数字を並べる枚は【1枚に全部 載せる】＝順位や対比は 並べて見せないと意味が無い。
   元の紙は はみ出すと箇条書きを1行ずつ別の枚に割る作りで、
   「茶23.0億／まんさいかん18.1億／野菜16.2億…」が 1行ずつ4枚に散っていた（実測）。
   この枚だけ 字を落として 1枚に収める。他の枚の大きさは 1つも変えていない。 */
.detaslide h1{font-size:78.0px;line-height:1.2;}
.detaslide .sub{font-size:44.0px;margin-top:22.0px;line-height:1.45;max-width:46ch;}
.detaslide ul.pts{margin-top:24.0px;gap:14.0px;}
.detaslide ul.pts li{font-size:42.0px;line-height:1.28;}
.detaslide ul.pts li::before{top:.42em;width:.45em;height:.45em;}
.detaslide .kicker{margin-bottom:20.0px;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="counter"></div>
<div id="hint">← → めくる｜ N=トーク台本の表示切替（画面共有中は押さない）</div>
<div id="note"></div>
<script>
/* 画面に出す見出し＋短い要点＝お客様に見せる分。note＝口で話す台本（発表者だけ・画面共有では出さない）
   藤原 美智子さん版（2026-08-19 20:00）
   ★藤原さんは【0. まだ始める前】＝売上も仕組みも まだ無い方。
     だから 価格を押さない。「お金が不安な方へ」の1枚を必ず通す。
     山＝「やってみないと分からないは正しい。だから小さく作って 数える」。
   ★根拠は 藤原さんの整理シート(2026-08-15 18:57:18 提出)の本人の言葉のみ。
     こちらで足した数字＝月5万の割り算と テニスコートの寸法の2つだけ（どちらも出どころを画面に出す）。
     薬・肥料・量・時期の話は0か所。他のお客様の実名・連絡先は0か所。ご主人様が2026-08-18に禁じた言い方は0か所（すべて言い換え済み）。
   ★本人が書いた事＝京都市伏見区深草／テニスコート2つ分を数名で／使える資金は殆ど無い／
     目標 月5万／一人／販売まだ無し／週2、3日から／秋に種を撒くのが良い野菜から */
const S = [
 {cls:"cover", kicker:"農業相談会", h:"今日は、始める前の不安を<br>ひとつ軽くする時間です", sub:"藤原さんが書いてくださった「体力がやってみないとどこまで出来るのかが分からない」——ここを、今日その場で並べ直します。",
  tag:"農業相談会", note:"藤原さん、本日はお時間ありがとうございます。今日は、藤原さんがシートに書いてくださった今の不安を、その場で並べ直して、いま困っている所・詰まっている所はクリアできる、というところまで持って帰っていただく時間です。いきなり何かを売る場ではありません。前半はほとんど、僕が聞く時間にします。"},

 {kicker:"はじめに", h:"今日のゴール", pts:["いま不安な所を、その場で仕分ける","「始める順番」を、言葉にして共有する","月5万までの道のりの、最初の1つを決める"],
  note:"今日のゴールは3つです。1つ、いま不安な所を その場で仕分ける。2つ、始める順番を言葉にして共有する。3つ、月5万までの道のりの、最初の1つを決める。この3つが揃うと、いま困っている所はクリアできる、という感覚を持って帰っていただけると思っています。"},
 {kicker:"はじめに", h:"今日の進め方", sub:"前半は、僕がひたすら聞きます。書いてくださった内容を、1つずつ深く。そのあとで、僕の考え方をお伝えします。合わなければ無理に案内しません。",
  note:"進め方です。前半は僕がひたすら聞きます。シートに書いてくださった内容を、1つずつ深く聞かせてください。そのあとで僕の考え方をお伝えします。合わないと感じられたら、無理に案内はしません。役に立てる時だけ提案します。"},

 {kicker:"自己紹介", h:"中川一郎<br>農業歴16年・1代目です", sub:"親から継いでいません。何も持っていない所から始めました。だから「始める前」の話が、いちばんできると思っています。", pts:["1代目・親から継がずに始めた","いまは1日実働 約5時間","年間100t超（2026年は200tも視野）","繁忙期は、学びに来る方を受け入れる側"],
  note:"本題の前に少しだけ自己紹介を。農業歴16年の1代目です。親から継いでいません。畑も、道具も、売り先も、何も持っていない所から始めました。今は1日実働 約5時間で、年間100t超。2026年は200tも視野に入っています。藤原さんは今『まだ始める前』と書いてくださっていて、そこは僕が一番よく分かる場所です。"},

 /* ===== 前半＝聞く（ここで15分）===== */
 {kicker:"確認させてください", h:"藤原さんが、もう答えを<br>書いてくださっていました", sub:"※シートに書いてくださった言葉、そのままです",
  quote:"体力がやってみないとどこまで出来るのかが分からない",
  note:"最初に、これを読ませてください。シートに書いてくださった言葉です。『体力がやってみないとどこまで出来るのかが分からない』。——これ、正しいんです。やってみないと分かりません。僕も分かりませんでした。今日やることは、その不安を消すことではなくて、『やってみないと分からない』を、どうやって小さく試すか、に置き換えることです。※不安を否定しない。『分からなくて当然』の温度で受ける。"},
 {kicker:"確認させてください", h:"畑が、もう在るのが<br>いちばん大きいです", sub:"「やっと、作業が出来る畑が出来た」——ここまで来ている方は、そう多くありません。始める前のいちばん高い壁は、もう越えておられます。",
  note:"もうひとつ、読ませてください。『やっと、作業が出来る畑が出来たので』。——この『やっと』に、たぶん時間がかかっていますよね。農地は、お金があれば借りられるものではありません。僕も土地の信用を作るのに10年かかりました。始める前のいちばん高い壁は、実はここなんです。藤原さんは、もうそこを越えておられる。まず聞きたいのですが、その畑、どうやって手に入りましたか。"},

 {kicker:"藤原さんの、本当の悩み", h:"「やってみないと分からない」を、<br>分解します",
  diagram:`<div class="worrycards">
    <div class="wcard"><div class="wc-h">① からだ</div><div class="wc-b"><b>体力がどこまで<br>もつか分からない</b></div></div>
    <div class="wcard"><div class="wc-h">② 作る物</div><div class="wc-b"><b>何を作るかは<br>これから</b></div></div>
    <div class="wcard on"><div class="wc-h">③ でも</div><div class="wc-b">「やっと 畑が出来た」<br><b>＝もう動いておられる</b></div></div>
  </div>`,
  note:"藤原さんの『やってみないと分からない』を分解すると、中身は2つの分からない、です。1つ、体力がどこまでもつか。2つ、何を作るか。——ここが肝心なんですが、この2つは どちらも『考えても出ない』種類の分からない、なんです。頭で答えが出ない。やって数えるしか出ない。そして右の1枚がいちばん大事で、藤原さんはもう畑を用意して、週2〜3日から始めると決めておられる。もう動いておられるんです。だから今日やるのは、不安を消すことではなくて、その2つを どう数えるかを決めることです。"},
 {kicker:"ここ、大事です", h:"藤原さんは、ゼロじゃありません", pts:["作業ができる畑が、もう在る","週2〜3日、出られる時間が在る","一緒に畑を使う方が、近くに居る"],
  note:"ここ、大事なので言わせてください。藤原さんはゼロから始める方ではありません。作業ができる畑がもう在る。週2〜3日、出られる時間が在る。そして畑を一緒に使う方が近くに居られる。——この3つが揃っている方って、実はそんなに多くないんです。ご自分では当たり前に思っておられませんか。"},

 {kicker:"今日いちばん聞きたいこと", h:"不安な所を、<br>1つずつ聞かせてください",
  diagram:`<div class="worrycards">
    <div class="wcard"><div class="wc-h">① からだ</div><div class="wc-b"><b>体力がどこまで<br>もつか</b></div></div>
    <div class="wcard"><div class="wc-h">② 作る物</div><div class="wc-b"><b>何を作るかは<br>これから</b></div></div>
    <div class="wcard"><div class="wc-h">③ お金</div><div class="wc-b"><b>使える資金は<br>ほとんど無い</b></div></div>
  </div>`,
  note:"シートを読ませていただいて、不安な所が3つ見えました。1つ、体力がどこまでもつか分からない。2つ、作る物はこれから。3つ、使える資金はほとんど無い。この3つを、1つずつ、少し細かく聞かせてください。ここが今日の前半の中心です。ゆっくりで大丈夫です。※ここから3枚、15分ほど使って聞く。答えを返そうとしない・遮らない。"},

 {kicker:"深掘り ①", h:"体力は今、<br>どこまで やれていますか", sub:"週2〜3日から、と書いてくださいました。1日どのくらい 畑に出られていますか。",
  note:"【深掘りの問い・3つ】<b>①</b> 今、畑には週に何日、1日どのくらい出ておられますか。<b>②</b> やってみて『これはきつい』と感じた作業は、どれでしたか。<b>③</b> 逆に『これは平気だった』作業はありますか。<br>——さらに聞けるなら：畑は家からどのくらいですか／お仕事や他のご予定との兼ね合いはどうですか／体のどこがいちばん先にきますか（腰・膝・手）。<br>★『頑張りましょう』と言わない。<b>今 やれている量</b>を数字で出してもらう所が目的。ここが後半の『小さく測る』の土台になる。"},
 {kicker:"深掘り ②", h:"秋に撒く物で、気になって<br>いる野菜はありますか", sub:"何を作るかは これから、と書いてくださいました。今 頭に浮かんでいる物を教えてください。",
  note:"【深掘りの問い・3つ】<b>①</b> 今、頭に浮かんでいる野菜はありますか。名前が出なくても『こういう物』でいいです。<b>②</b> ご自分で食べたい物ですか、それとも売れそうな物ですか。<b>③</b> 周りの方、畑を一緒に使っている方は、何を作っておられますか。<br>——さらに聞けるなら：畑の土はどんな感じですか／水は近くにありますか／日当たりはどうですか。<br>★ここで品種名を こちらから並べない。<b>本人の頭に在る物</b>を出してもらう。作物の決め方は後で。"},
 {kicker:"深掘り ③", h:"資金が無くても、<br>始められます", sub:"お金が無いことは、始めない理由になりません。ただし、順番を間違える余裕も無い、ということです。",
  note:"【深掘りの問い・3つ】<b>①</b> 今、種や苗、道具に かけられるのは月にどのくらいですか。ざっくりで大丈夫です。<b>②</b> 今 持っている道具は何がありますか。<b>③</b> 畑を一緒に使っている方から借りられる物はありますか。<br>——さらに聞けるなら：出荷先の候補、直売所や道の駅は近くにありますか。<br>★金額を評価しない。『少ない』と言わない。お金が無いからこそ順番が命、という話に橋を架ける。"},

 {kicker:"確認させてください", h:"1年後の願いが、<br>とても具体的でした", quote:"どれだけの作業が出来るのかを自分自身、把握する。",
  note:"1年後どうなっていたいか、で こう書いてくださいました。『どれだけの作業が出来るのかを自分自身、把握する』。——これ、実はすごく良い目標です。多くの方は『いくら稼ぐ』と書かれるんですが、藤原さんは『自分がどれだけできるかを知る』と書かれた。これは、農業では一番 先に要る物なんです。今日はこの言葉を軸にして話をさせてください。"},
 {kicker:"確認させてください", h:"「このまま」だと、<br>1年後どうなっていますか", sub:"焦らせたいわけではありません。ただ、決めないまま置いておくことにも、時間という費用がかかります。",
  note:"少し意地悪な質問をさせてください。もし今のまま、何を作るかも、どのくらい動けるかも決めないまま1年 経ったら、藤原さんはどんな気持ちでおられると思いますか。——畑って、使わないと荒れます。そして一緒に使っておられる方との関係も、動いている人の所に集まります。焦らせたいわけではありません。ただ、決めないまま置いておくことにも、時間という費用がかかっている、という話です。※ここは深追いしない。1つ聞いて、答えを受けたら次へ。"},
 {kicker:"確認させてください", h:"本当は、どんな1日を<br>思い描いておられますか", sub:"月5万が稼げて、体と相談しながら少しずつ増やしていく——その先に、どんな1日がありますか。",
  note:"もう1つ聞かせてください。『月5万が稼げるのか、稼げるとしたら体力共相談しながら増やして行きたい』と書いてくださいました。その先に、どんな1日を思い描いておられますか。朝どのくらいに畑に出て、どのくらいで帰って、残りの時間で何をしていたいか。——正解を決める場ではありません。ここを言葉にしておくと、今日の後半の順番の話が、ぐっと自分ごとになります。"},
 {kicker:"確認させてください", h:"いま居る場所は、<br>ここで合っていますか", sub:"申込では「0. まだ始める前」を選んでくださいました。シートの中身も、そこを指しています。ここは、ずれていません。",
  note:"ここ、今日いちばん大事な確認です。申込のときに『0. まだ始める前』を選んでくださいました。そしてシートの中身、体力のこと、作る物のこと、販売はまだ無し。全部そこを指しています。つまり藤原さんは、行きたい場所と、いま居る場所が、ずれていません。これは強いです。順番を間違える方の多くは、行きたい場所ばかり見て、いま居る場所を見ていないからです。現在地って、自分が一番見えないんですよ。藤原さんはそこが見えている。だから今日は、その先の順番の話ができます。"},

 {kicker:"ポイント", h:"この3つ、順番を決めれば<br>軽くなります。聞いてみますか？", sub:"新しく何かを買う話ではありません。どれを先にやるか、の話です。",
  note:"【テストクロージング①・軽く】ここまで聞かせていただいて、この3つは順番を決めれば軽くなる、と僕は思っています。新しく何かを買う話ではなくて、どれを先にやるか、という話です。その順番の話、聞いてみますか？——『はい』をいただいてから次へ。押さない。"},

 /* ===== 中盤＝順番の考え方（★この回の山） ===== */
 {kicker:"ここが山です", h:"分からないのは正しい。<br>だから小さく作って、数える", sub:"体力は、考えても分かりません。1週間 やってみて、何時間 動けたかを数える。それが一番早くて、一番安い答えです。",
  note:"【今日いちばん伝えたい所・ゆっくり】『体力がやってみないと分からない』——これは本当にその通りです。考えても出ません。だから、答えを出す方法は1つしかないんです。小さくやってみて、数える。たとえば1週間、畑に出た日と、1日に動けた時間を紙に書く。それだけで『自分はこのくらいできる』が数字になります。1年後の願いに書かれた『どれだけの作業が出来るのかを自分自身、把握する』——それ、1年かからないんです。数え始めた日から分かり始めます。ここが、今日いちばん持って帰っていただきたいところです。"},
 {kicker:"考え方", h:"悩みは、3つのどれかに<br>仕分けるところから", pts:["安定 … 読める量が作れているか","売り先 … 誰に・なぜ選ばれ・続くか","拡大 … 面積・人・設備"],
  note:"次に、順番の話です。出てきた悩みを、そのまま打ち手にしないことです。『これは安定の話か、売り先の話か、拡大の話か』に置き直す。藤原さんの場合は、まだ売り先も無くて、面積を増やす所でもありません。ですから、やることは全部『安定』に入ります。ここが分かると、今 やらなくていい事がはっきりします。"},
 {kicker:"考え方", h:"行きたい場所ではなく、<br>いま居る場所を見る", sub:"目標も、選んだ番号も「行きたい場所」。決め手になるのは、いま居る場所です。そして現在地は、自分が一番見えません。",
  note:"目標も、選んだ番号も、行きたい場所です。決め手になるのは、いま居る場所。そして現在地は本人が一番見えない。僕自身も最初は一人で考えて、順番を間違えて10年 遠回りしました。知識も情報もあったんです。でもそれを自分の畑に、自分に合う形にできなかった。だから他人と突き合わせる意味があります。"},
 {kicker:"考え方", h:"お金が無いからこそ、<br>順番が命です", sub:"買って試す、が使えません。だから「やってみて数える」が、いちばん安くて確実な打ち手になります。",
  note:"お金の話も逃げずにします。使える資金がほとんど無いと書いてくださいました。ということは、『買って試す』が使えません。僕自身、50万・100万を投じて使えなかった機械が倉庫に眠っています。場所も取るし、売れないし、雨ざらしにすれば朽ちる。知らないまま買うと、時間もお金も失います。藤原さんの場合は、お金をかけずにできる打ち手——やってみて数える——が、いちばん強い手になります。これは、お金がある方より有利な所かもしれません。"},

 {kicker:"ここを考えたいです", h:"月5万って、<br>どのくらいの量だと思いますか",
  diagram:`<div class="qbig xl">月5万 ＝ <span class="q">？</span></div>
  <div class="note-in">藤原さんなら、どのくらいの量を思い浮かべますか。</div>`,
  note:"【2枚組の1枚目・ここは必ず本人に答えさせる】ちょっと質問させてください。『月5万が稼げるのか』と書いてくださいました。この月5万、どのくらいの量だと思われますか。——先に答えを言わない。10秒でも20秒でも待つ。出てきた答えは否定せず、そのまま拾って次の1枚へ。"},
 {kicker:"僕の答えです", h:"月5万は、<br>1日ぶんの量ではありません",
  diagram:`<div class="qbig">月5万 ＝ 1日 <span class="q">約1,700円</span></div>
  <div class="note-in">週2〜3日なら、出す日1日あたり 約5,000円ぶん。</div>
  <div class="deta">計算＝本人が書いた「月5万」÷30日≒1,700円／本人が書いた「週2、3日」＝月およそ10日として 5万÷10日＝5,000円。単価も売れる量も、こちらでは決めていません。</div>`,
  note:"【2枚組の2枚目・答え】月5万を30日で割ると、1日あたり約1,700円です。藤原さんは週2〜3日と書かれていますから、出す日で数えると1日あたり5,000円ぶん。——ここ、大事なので言い方に気をつけます。『たったこれだけ』とは言いません。ゼロから5,000円を毎回きちんと出すのは、簡単ではありません。でも『月5万』という言葉よりは、ずっと形が見えると思うんです。何を何袋 出せばそこに届くのか、それを今日 一緒に置いてみましょう。※単価はこちらから決めない。直売所の値は地域で違うので『実際いくらで売れているか』は本人に確認する。〔当日 記入〕"},

 {cls:"detaslide", kicker:"畑の広さの話", h:"テニスコート2面分は、<br>だいたい5アールです", sub:"「テニスコート2つ分を数名が使って行く」と書いてくださいました。ここを数字にしておくと、月5万までの道のりが見えます。",
  pts:["テニスコート1面（ダブルス）＝23.77m × 10.97m ＝ 約260.7㎡","2面分 ＝ 約521㎡ ＝ 約5.2アール（1アール＝100㎡）","それを数名で分ける ＝ 藤原さんの受け持ちは その何分の1か"],
  diagram:`<div class="deta">出典＝国際テニス連盟（ITF）「Rules of Tennis」コートの寸法（ダブルス 78ft × 36ft ＝ 23.77m × 10.97m）／日本テニス協会 コート規格。<br>〔要確認〕何名で分けるか・藤原さんの受け持ちが何㎡かは、当日 本人に聞く。</div>`,
  note:"広さの話を、数字にさせてください。テニスコート1面は、ダブルスの大きさで23.77メートル×10.97メートル、約260平方メートルです。2面分でおよそ521平方メートル、5.2アールになります。それを数名で分けられる。——ここで聞きたいのですが、何名で使われる予定ですか。藤原さんの受け持ちは、そのうちどのくらいになりそうですか。★ここは絶対に『狭いですね』と言わない。次の1枚で『だから小さく確かめるのに向いている』へ持っていく。"},
 {kicker:"考え方", h:"狭いのは、<br>始める時には むしろ有利です", sub:"広い畑をいきなり任されると、手が回らず荒れます。小さい畑は「1周 やり切れる」——これが最初の1年でいちばん効きます。",
  note:"広さを聞いて『狭いな』と思われたかもしれません。でも、始める時に限っては、これは有利なんです。広い畑をいきなり預かった方は、まず草に負けます。手が回らないまま荒れて、自信をなくして辞めていかれる。小さい畑は、1周 やり切れるんです。撒いて、育てて、穫って、出して、片付けて、また撒く。この1周を通せた人だけが『自分はどれだけできるか』を持てます。藤原さんが書かれた1年後の願いは、この1周の中に在ります。※ただし、月5万を続けていくなら、いずれ広さは要る。そこは正直に次の話で。"},
 {kicker:"正直に言います", h:"月5万をずっと続けるなら、<br>いずれ広さは要ります", sub:"今の広さで1周を通し切る。そのうえで、増やすかどうかを決める。順番はこれです。——「増やせない」ではなく「まだ そこじゃない」です。",
  note:"正直な所も言っておきます。5アールを数名で分けた広さで、月5万を毎月ずっと、というのは簡単ではありません。いずれ広さは要ります。ただ、今それを心配しても答えは出ません。順番はこうです。まず今の広さで1周を通し切って、自分が何をどれだけできるかを数字にする。その数字が出てから、増やすかどうかを決める。——『増やせない』ではなくて、『まだ そこじゃない』という話です。畑は、動いている人の所に集まってきます。僕も、土地の信用を作るのに10年かかりました。"},

 {kicker:"もうひとつの道", h:"一人で全部を背負わなくて<br>いい道もあります", pts:["① 近くの農家さんの繁忙期を手伝って、体で覚える","② 一緒に畑を使う方と、道具や作業を分け合う","③ 直売所へ出しておられる方に、出し方だけ聞く"],
  note:"それから、これも置いておきます。『一人』と書いてくださいました。でも、一人で全部を背負う必要はありません。1つ、近くの農家さんの忙しい時期を手伝わせてもらう。体力の答えが、自分の畑より早く出ます。2つ、一緒に畑を使っておられる方と、道具や重い作業を分け合う。3つ、すでに直売所へ出しておられる方に、出し方だけ聞く。——どれもお金がかかりません。始める前の方にとって、これはかなり強い手です。※具体的にどこ、は当日 本人の地元の話を聞いてから。こちらから店の名前を出さない。"},

 /* ===== 僕の話・実績 ===== */
 {kicker:"僕の話", h:"僕も、順番を間違えて<br>10年 遠回りしました", sub:"売り先を先に作ろうとして、納品2週間前に量が半分。取引先に電話するのに手が震えました。怖くて当然なんです。",
  note:"偉そうに言っていますが、僕も最初は順番を間違えました。売り先を先に作ろうとして、納品2週間前に出せる量が半分しかなくて、取引先に謝る電話をするとき手が震えました。補助金も投資に回せず生活費に消えた。ニンジンをほぼ腐らせて、その病気の名前すら知らなかった。一人で考えて10年 遠回りしました。だから、同じ間違いをしてほしくないんです。"},
 {kicker:"実績", h:"1日実働 約5時間。<br>長く働いた結果ではありません", sub:"朝9時から14時。順番を決めて、そのつど仕組みに変えてきた結果です。",
  note:"今、1日実働 約5時間です。朝9時から14時。長く働いた結果ではなくて、準備・販路・技術改善を、そのつど仕組みに変えてきた結果です。体力で押し切っているわけではありません。ここは、体力を心配されている藤原さんに、いちばんお伝えしたい所です。"},
 {kicker:"実績", h:"年間100t超。<br>2026年は200tも視野に", sub:"最初から100tだったわけではありません。読める量を作るところから始めています。",
  note:"量で言うと、年間100t超まで来ました。2026年は200tも視野に入っています。ただ、最初から100tだったわけではありません。まず読める量を作る、そこからです。"},
 {kicker:"実績", h:"大不作の年でも、<br>3日で1ヶ月分を回収", sub:"2024年、全国的な大不作の年。多くの生産者が出せない中で、3日間で1ヶ月分の売上を回収しました。運ではありません。",
  note:"2024年、全国的な大不作の年がありました。多くの生産者が出せない中で、3日間で1ヶ月分の売上を回収しました。運ではなくて、作る前・売る前・届ける前に準備が整っていたからです。"},
 {kicker:"実績", h:"産地化と、3年連続の表彰", sub:"愛知で初めて有機JASのニンジンを産地化。別の作物で3年連続の表彰。発芽率は70%から95%以上へ。",
  note:"愛知で初めて有機JASのニンジンを産地化しました。表彰は、それとは別に、ニンジン・白菜・キャベツで3年連続いただいています。発芽率も70%から95%以上に上げました。順番と改善の積み重ねです。"},

 /* ===== 相談者の声（実素材のみ・すべて匿名） ===== */
 {kicker:"相談者の声", h:"1年前、ゼロから始めた方", sub:"※お名前は伏せています",
  quote:"今まで私はデパートの営業をしていたんですけど、親の土地を相続したのがきっかけで、体力的にもきつくて、農業で生活していくしかないなと思ったんです。最初は自然農をやろうと思っていました。でも自然農や有機で野菜をやっている方に会っても、どうやって稼ぐかを教えてくれる人がいなかったんです。具体的な売上の作り方が出てこない。そこがずっと不安でした。",
  note:"ゼロから始めた受講生の声です。お名前は伏せています。『どうやって稼ぐかを教えてくれる人がいなかった』——藤原さんの『やってみないと分からない』と、地続きだと思っています。"},
 {kicker:"相談者の声", h:"現場で学べた、という安心感", sub:"※お名前は伏せています",
  quote:"このハウスを建てるまでの半年、イチローさんが栽培している作物を触って、出荷までやってみて、リアルに学べたのが大きかったです。イチローさんが失敗した話を全部してくれたから、失敗してもどう建て直すかが分かる、という安心感がありました。",
  note:"知識だけでなく、現場で触って覚えられた、という声です。うまくいった話だけでなく、失敗した話まで出すようにしています。失敗してもどう建て直すかが分かると、動けるようになります。"},
 {kicker:"相談者の声", h:"「この人がいけるなら、<br>私もいけるかも」", sub:"※お名前は伏せています",
  quote:"実際に、イチローさんが売っているのを見ているから、“売り上げいけるんだ”って実感できます。“この人がいけるなら、私もいけるかも”って。“農業しかない”という気合いしかなかった私が、先の見通しを立てて、ハウスまで建てられたのは、一郎さんのおかげです。やると決めたら、意外と早かったです。",
  note:"実際にできている人と接すると、景色が変わる、という声です。『やると決めたら意外と早かった』——ここは藤原さんにも同じことが起きると思っています。"},
 {kicker:"相談者の声", h:"始める前から、<br>利益設計で悩んでいた方", sub:"※お名前は伏せています。まだ始めておられない時期の方です。",
  quote:"まず安定させることが一番だなと。認定を取らないとブランド化も難しいのかなと気づきました。費用や認定業者の選び方まで質問して、全部答えてもらえたのでとてもよくわかりました。",
  note:"藤原さんと同じ『まだ始める前』の方の声です。まだ始めていないからこそ、まず安定させることが一番だと気づかれた。分からない所を、その場で全部 聞ける——そこが役に立った、と言っていただきました。※この方の書かれた言葉をそのまま読み上げています。"},

 /* ===== 利益が残る農業 ===== */
 {kicker:"利益が残る農業", h:"利益が残るのは、<br>この3つが揃った時です", pts:["安定して作れる","買ってくれる相手がいる","利益が出る形で続く"],

 {kicker:"利益が残る農業", h:"まず「安定」", sub:"芽が出る・穫れる・品質がそろう・作業が回る。ここが定まらないと、売り先を作っても約束を守れません。藤原さんは まず ここだけです。",

 {kicker:"利益が残る農業", h:"次に「売り先」", sub:"誰に・なぜ選ばれ・どの価格で続くか。藤原さんは「販売はまだ無し」——ここは、これから作る所です。",

 {kicker:"利益が残る農業", h:"最後に「拡大」", sub:"安定と売り先ができてから、面積・人・設備。ここまで来て初めて、月5万を毎月続ける絵がはっきりします。",

 {kicker:"月5万の話", h:"月5万は、<br>一気には届きません",

    <div class="step s2"><div class="n">1つ目</div><div class="v">？</div></div>

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.cls?(' '+s.cls):'');
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  inner+=`<h1>${s.h}</h1>`;
  if(s.sub) inner+=`<div class="sub">${s.sub}</div>`;
  if(s.quote) inner+=`<div class="quote">「${s.quote}」</div>`+(s.subq?'':'');
  if(s.sub&&s.quote){}
  if(s.pts){inner+='<ul class="pts">'+s.pts.map(p=>`<li>${p}</li>`).join('')+'</ul>';}
  if(s.diagram) inner+=s.diagram;
  if(s.tag) inner+=`<div class="tag">${s.tag}</div>`;
  if(s.who) inner+=`<div class="who">${s.who}</div>`;
  inner+=`<div class="foot">稼げる農業の仕組み化 伴走プログラム</div>`;
  d.innerHTML=inner;
  d.dataset.note=s.note||'';
  stage.appendChild(d);
});

/* ★入り切らない枚を【縮めずに 2枚へ割る】（ご主人様2026-08-17「細かい文字はだめ」）
   割る所＝箇条書きの最後の1行から。割った先の見出しは「（つづき）」を付ける。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display='flex';
    var ng = el.scrollHeight > el.clientHeight + 2;
    el.style.display = m;
    return ng;
  }
  var stage = document.getElementById('stage');
  var mawaru = 0;
  while (mawaru < 40) {
    var s = stage.querySelectorAll('.slide');
    var watta = false;
    for (var i = 0; i < s.length; i++) {
      var el = s[i];
      if (!afureteru(el)) continue;
      var ul = el.querySelector('ul.pts');
      if (!ul || ul.children.length < 2) continue;      /* 割れない枚は そのまま */
      var atarashii = el.cloneNode(true);
      /* ★ご主人様2026-08-17 18:08「中川一郎なんとか、中川一郎なんとかって【連呼】されている。
         タイトルは1回で良い。その後は中身を伝えていけばいい」
         ＝割った先で 大きい見出しを もう一度 出すのをやめる。
         　小さい行（kicker）に「◯◯（つづき）」と置くだけにする。 */
      /* ★ご主人様2026-08-17 18:15（本人の文字・そのまま）
         「**(つづき)いらない／全てつづき**」「**全て続きだから そんな表記はいらない。要らぬお世話**」
         ＝割った先の枚では **見出しも（つづき）の表記も 出さない**。中身だけ続ける。 */
      var h = atarashii.querySelector('h1,h2');
      if (h) { h.remove(); }
      /* 新しい方＝最後の1行だけ残す／元の方＝最後の1行を落とす */
      var nul = atarashii.querySelector('ul.pts');
      while (nul.children.length > 1) { nul.removeChild(nul.firstElementChild); }
      var sub = atarashii.querySelector('.sub'); if (sub) { sub.remove(); }
      var q = atarashii.querySelector('.quote'); if (q) { q.remove(); }
      ul.removeChild(ul.lastElementChild);
      atarashii.classList.remove('active');
      el.parentNode.insertBefore(atarashii, el.nextSibling);
      watta = true;
      break;
    }
    if (!watta) break;
    mawaru++;
  }

  /* ★割れない枚（表紙・カード・大きい数字など）だけ、最後の方法で文字を落とす。
     ただし【元の大きさより小さくはしない】＝BAI 倍ぶんの余地の中だけで詰める。 */
  var s2 = stage.querySelectorAll('.slide');
  for (var k = 0; k < s2.length; k++) {
    var el2 = s2[k];
    var kai = 0;
    var nokori = 1 / 1.500;               /* ここまでしか小さくしない（＝元の大きさ） */
    var ima = 1.0;
    while (afureteru(el2) && kai < 12 && ima > nokori + 0.001) {
      var m2 = el2.style.display; el2.style.display = 'flex';
      var r = Math.max(0.94, el2.clientHeight / el2.scrollHeight);
      if (ima * r < nokori) { r = nokori / ima; }
      var ko = el2.querySelectorAll('*');
      for (var j = 0; j < ko.length; j++) {
        var cs = window.getComputedStyle(ko[j]);
        var f = parseFloat(cs.fontSize);
        if (f > 0) { ko[j].style.fontSize = (f * r) + 'px'; }
        var mt = parseFloat(cs.marginTop);
        if (mt > 0) { ko[j].style.marginTop = (mt * r) + 'px'; }
        var g = parseFloat(cs.rowGap);
        if (g > 0) { ko[j].style.rowGap = (g * r) + 'px'; }
      }
      var sp = parseFloat(window.getComputedStyle(el2).paddingTop);
      if (sp > 8) { el2.style.paddingTop = (sp * r) + 'px'; el2.style.paddingBottom = (sp * r) + 'px'; }
      el2.style.display = m2;
      ima = ima * r;
      kai++;
    }
  }
})();
let cur=0;const slides=[...document.querySelectorAll('.slide')];
const counter=document.getElementById('counter');
const noteBox=document.getElementById('note');let noteOn=false;
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  counter.textContent=(cur+1)+' / '+slides.length;
  if(noteOn){noteBox.innerHTML='<b>🎙 トーク台本（発表者のみ）：</b> '+(slides[cur].dataset.note||'—');}
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);}
  else if(e.key.toLowerCase()==='n'){noteOn=!noteOn;noteBox.classList.toggle('show',noteOn);show(cur);}
  else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
});
stage.addEventListener('click',()=>show(cur+1));
const _h=parseInt((location.hash||'').slice(1),10);
show(isNaN(_h)?0:_h);
</script>

<script>
// ★箱ごと 画面に収まるだけ拡大／縮小する
// ★zoom を使う：transform は .slide.active の fade の keyframe が
//   transform:none で上書きするので 効かなかった（実測して分かった）
(function(){
  function fit(){
    var k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    var s = document.querySelectorAll('.slide');
    for (var i = 0; i < s.length; i++) { s[i].style.zoom = k; }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  document.addEventListener('keydown', function(){ setTimeout(fit, 10); });
  document.addEventListener('click', function(){ setTimeout(fit, 10); });
  window.addEventListener('load', fit);
  setTimeout(fit, 30);
  setInterval(fit, 800);
})();
</script>

<script>
/* ★はみ出しの【最後の1回】＝字が全部そろってから もう一度 見る。
   元の紙の縮め方は 読み込みの途中で1回だけ走る＝字が後から届くと 3〜6px はみ出したまま残る。
   （実測＝92枚中5枚が 3〜6px はみ出していた）。ここでは 残った分だけ 0.98倍ずつ詰める。
   ★見本のCSSも 元の script も さわっていない。後ろに足しただけ。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display = 'flex';
    var ng = el.scrollHeight > el.clientHeight + 1;
    el.style.display = m;
    return ng;
  }
  function tsumeru(){
    var s = document.querySelectorAll('.slide');
    for (var i = 0; i < s.length; i++) {
      var el = s[i], kai = 0;
      while (afureteru(el) && kai < 25) {
        var m = el.style.display; el.style.display = 'flex';
        var ko = el.querySelectorAll('*');
        for (var j = 0; j < ko.length; j++) {
          var cs = window.getComputedStyle(ko[j]);
          var f = parseFloat(cs.fontSize);
          if (f > 0) { ko[j].style.fontSize = (f * 0.98) + 'px'; }
          var mt = parseFloat(cs.marginTop);
          if (mt > 0) { ko[j].style.marginTop = (mt * 0.98) + 'px'; }
          var g = parseFloat(cs.rowGap);
          if (g > 0) { ko[j].style.rowGap = (g * 0.98) + 'px'; }
        }
        el.style.display = m;
        kai++;
      }
    }
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function(){ setTimeout(tsumeru, 60); }); }
  window.addEventListener('load', function(){ setTimeout(tsumeru, 300); });
  setTimeout(tsumeru, 1200);
})();
</script>
