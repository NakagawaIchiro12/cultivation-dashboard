<title>農業相談会スライド（馬場雅恵さん）</title>
<style>
  :root{ --green:#2e7d32; --green-d:#1b5e20; --ink:#12200f; --paper:#f6f8f3; --gold:#b8892b; --line:#dfe6d8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#0e1410;color:var(--ink);overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{background:#0e1410;}
  .slide{display:none;width:1600px;height:900px;flex:0 0 auto;padding:81.0px 6%;flex-direction:column;justify-content:center;box-shadow:0 0 40px rgba(0,0,0,.5);
         position:relative;background-color:var(--paper);
         background-image:linear-gradient(100deg,
             rgba(246,248,243,.98) 0%, rgba(246,248,243,.96) 48%,
             rgba(246,248,243,.97) 74%, rgba(246,248,243,.94) 100%),
           url('bg-content.jpg');
         background-size:cover;background-position:center right;}

  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{color:var(--green-d);font-weight:800;font-size:40.5px;letter-spacing:.12em;margin-bottom:35.1px;}
  h1{font-size:113.4px;line-height:1.22;color:var(--green-d);font-weight:900;letter-spacing:.01em;}

  .sub{font-size:62.1px;line-height:1.55;margin-top:45.9px;color:#12200f;font-weight:600;max-width:40ch;}
  ul.pts{margin-top:48.6px;list-style:none;display:flex;flex-direction:column;gap:35.1px;}
  ul.pts li{font-size:64.8px;line-height:1.4;font-weight:700;padding-left:1.4em;position:relative;color:#12200f;}
  ul.pts li::before{content:"";position:absolute;left:0;top:.5em;width:.55em;height:.55em;border-radius:50%;background:var(--gold);}
  .quote{font-size:59.4px;line-height:1.6;color:#12200f;font-weight:600;max-width:38ch;margin-top:35.1px;
         border-left:10.8px solid var(--green);padding:13.5px 0 13.5px 48.0px;background:#fff;border-radius:0 12px 12px 0;
         box-shadow:0 6px 24px rgba(30,60,25,.08);padding-right:48.0px;padding-top:35.1px;padding-bottom:35.1px;}
  .who{margin-top:32.4px;font-size:45.9px;color:var(--gold);font-weight:800;}
  .big{font-size:135.0px;color:var(--green-d);font-weight:900;}
  .price{font-size:175.5px;color:var(--green-d);font-weight:900;letter-spacing:.02em;}
  /* 核心の悩み 見える化 */
  .worrycore{margin-top:29.7px;font-size:86.4px;line-height:1.25;color:var(--green-d);font-weight:900;
             background:#fff;border-left:13.5px solid var(--gold);border-radius:0 14px 14px 0;
             padding:32.4px 48.0px;box-shadow:0 8px 28px rgba(30,60,25,.10);max-width:34ch;}
  .worrycards{display:flex;gap:32.0px;margin-top:45.9px;flex-wrap:wrap;max-width:58ch;}
  .wcard{flex:1 1 0;min-width:297.0px;background:#fff;border:4.0px solid var(--line);border-radius:16px;
         padding:29.7px 25.6px;box-shadow:0 6px 20px rgba(30,60,25,.07);}
  .wcard.on{background:#eef6ea;border-color:var(--green);}
  .wc-h{font-size:40.5px;font-weight:800;color:var(--gold);letter-spacing:.04em;margin-bottom:16.2px;}
  .wcard.on .wc-h{color:var(--green-d);}
  .wc-b{font-size:48.6px;line-height:1.4;font-weight:700;color:#12200f;}
  .wc-b b{color:var(--green-d);}
  .cover{background-image:linear-gradient(100deg,
             rgba(247,250,244,.93) 0%, rgba(247,250,244,.88) 40%,
             rgba(247,250,244,.95) 72%, rgba(247,250,244,.90) 100%),
           url('bg-cover.jpg');
         background-size:cover;background-position:center right;color:var(--ink);
         border-top:16.2px solid var(--green-d);}
  .cover h1{color:var(--green-d);font-size:121.5px;text-shadow:none;}
  .cover .sub{color:#33422f;}
  .cover .kicker{color:var(--green);}
  .cover .tag{background:var(--green-d);color:#fff;box-shadow:0 6px 20px rgba(27,60,25,.22);}
  .tag{display:inline-block;background:#fff;color:var(--green-d);font-weight:800;border-radius:999px;
       padding:17.6px 48.0px;font-size:48.6px;margin-top:54.0px;}
  .foot{display:none;}
  #counter{position:fixed;right:38.4px;bottom:32.4px;font-size:40.5px;font-weight:700;color:#2e7d32;background:rgba(255,255,255,.85);
           padding:10.8px 28.8px;border-radius:999px;z-index:20;}
  /* presenter notes: hidden by default, toggle with N. Warn: do not toggle while screen-sharing. */
  #note{position:fixed;left:0;right:0;bottom:0;background:#12241a;color:#eafff0;padding:32.4px 128.0px;
        font-size:40.5px;line-height:1.6;display:none;z-index:30;border-top:6.8px solid var(--gold);max-height:594.0px;overflow:auto;}
  #note.show{display:block;}
  #note b{color:var(--gold);}
  #hint{display:none;}
  .warn{position:absolute;top:40.5px;right:128.0px;font-size:37.8px;color:#b8892b;font-weight:800;}

  /* ★スマホ版で足した分 */
  #stage{overflow:hidden;}
  .slide{overflow:hidden;}
  .slide.active{animation:none !important;}
  body{-webkit-text-size-adjust:100%;}
</style>
<!-- ▼ここから下は「前回の方の版で足した1枚」＝見本(前の回の方版)のCSSは1文字も変えていない -->
<style>

</style>

<style>
/* ★2026-08-18 足した分＝この4つの指定が 元の紙に1つも無く、

.steps{display:flex;gap:20.0px;margin-top:29.7px;flex-wrap:wrap;width:100%;}
.step{flex:1 1 0;min-width:260.0px;background:#fff;border:4.0px solid var(--line);border-radius:16px;
      padding:20.0px 20.0px;box-shadow:0 6px 20px rgba(30,60,25,.07);}
.step .n{font-size:35.0px;font-weight:800;color:var(--gold);letter-spacing:.04em;margin-bottom:11.0px;}

.step.s4{background:#eef6ea;border-color:var(--green);}
.step.s4 .n{color:var(--green-d);}
.qbig{margin-top:37.8px;font-size:86.4px;font-weight:900;color:var(--green-d);line-height:1.32;}
.qbig.xl{font-size:94.0px;}
.qbig .q{display:inline-block;background:#fff;border:5.0px solid var(--gold);border-radius:18px;
         padding:6.0px 30.0px;color:var(--green-d);}
.note-in{margin-top:29.7px;font-size:43.0px;color:#42513e;font-weight:700;line-height:1.45;}
/* 出典＝小さく・でも読める大きさで（数字を出したら必ず出どころを同じ画面に置く） */
.deta{margin-top:14.0px;font-size:26.0px;color:#5a6856;font-weight:700;line-height:1.35;word-break:break-all;}
/* ★数字を並べる枚は【1枚に全部 載せる】＝順位や対比は 並べて見せないと意味が無い。
   元の紙は はみ出すと箇条書きを1行ずつ別の枚に割る作りで、
   「茶23.0億／まんさいかん18.1億／野菜16.2億…」が 1行ずつ4枚に散っていた（実測）。
   この枚だけ 字を落として 1枚に収める。他の枚の大きさは 1つも変えていない。 */
.detaslide h1{font-size:78.0px;line-height:1.2;}
.detaslide .sub{font-size:44.0px;margin-top:22.0px;line-height:1.45;max-width:46ch;}
.detaslide ul.pts{margin-top:24.0px;gap:14.0px;}
.detaslide ul.pts li{font-size:42.0px;line-height:1.28;}
.detaslide ul.pts li::before{top:.42em;width:.45em;height:.45em;}
.detaslide .kicker{margin-bottom:20.0px;}
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* client-safe見出し＋短い要点＝projected。note=口頭トーク（発表者のみ・画面共有では出さない）
   馬場 雅恵さん版（2026-08-18 21:00）＝前回の方の版(2026-08-17)の作りをそのまま流用。
   ★馬場さんは【1. 生産の安定】の段＝前回の方の版の「人を入れて回す」の山は入れていない。
     代わりの山＝「道具が無いから広げられない、は順番が逆」＝いまの10アールで読める量を作る。
   ★根拠は全部 馬場さんの整理シート(2026-08-12 15:47:38 提出)の本人の言葉のみ。
     こちらで足した数字は0個。薬・量・時期の話は0か所。会社の実名は0か所。
   ★27アール／使えるのは10アール／朝5:00-7:30＋17:00-19:00＝1日4時間半／使える資金 月2万円／
     目標 年300万円／家族と／JA直売所へ オクラ・茄子・キュウリを2〜3袋／静岡県焼津市吉永 */
const S = [
 {cls:"cover", kicker:"農業相談会", h:"今日は、詰まっている所を<br>ひとつ外して帰る時間です", sub:"「設備や機具が揃っていない」——ここを、今日その場で並べ直します。",
  tag:"農業相談会", note:"馬場さん、本日はお時間ありがとうございます。今日は、馬場さんがシートに書いてくださった今の困りを、その場で並べ直して、いまいま困っている所・詰まっている所はクリアできる、というところまで持って帰っていただく時間です。いきなり何かを売る場ではありません。前半はほとんど、僕が聞く時間にします。"},

 {kicker:"はじめに", h:"今日のゴール", pts:["いま詰まっている所を、その場で仕分ける","「安定」の中身を、言葉にして共有する","年300万までの階段を、1段目まで決める"],
  note:"今日のゴールは3つです。1つ、いま詰まっている所を その場で仕分ける。2つ、安定の中身を言葉にして共有する。3つ、年300万までの階段を1段目まで決める。この3つが揃うと、いまいま困っている所はクリアできる、という感覚を持って帰っていただけると思っています。"},
 {kicker:"はじめに", h:"今日の進め方", sub:"前半は、僕がひたすら聞きます。書いてくださった内容を、一段ずつ深く。そのあとで、僕の考え方をお伝えします。合わなければ無理に案内しません。",
  note:"進め方です。前半は僕がひたすら聞きます。シートに書いてくださった内容を、一段ずつ深く聞かせてください。そのあとで僕の考え方をお伝えします。合わないと感じられたら、無理に案内はしません。役に立てる時だけ提案します。"},

 {kicker:"自己紹介", h:"中川一郎<br>農業歴16年・順番を決めて広げてきました", sub:"根性で量を出しているのではありません。順番を決めて、そのつど仕組みに変えて広げてきました。", pts:["1代目・親から継がずに始めた","いまは1日実働 約5時間","年間100t超（2026年は200tも視野）","繁忙期は、学びに来る方も受け入れる側"],
  note:"本題の前に少しだけ自己紹介を。農業歴16年の1代目です。親から継いでいません。今は1日実働 約5時間で、年間100t超。2026年は200tも視野に入っています。ここで大事なのは、僕が根性で量を出しているのではない、ということです。順番を決めて、そのつど仕組みに変えてきた結果です。馬場さんも今、勤めをしながら朝と夜で回されている。だから『時間を増やす』以外の話が、一番役に立つと思っています。"},

 /* ===== 前半＝聞く（ここで15分）===== */
 {kicker:"確認させてください", h:"馬場さんが、もう答えを<br>書いてくださっていました", sub:"※シートに書いてくださった言葉、そのままです",
  quote:"今は枝葉の作業に追われているのでもっと栽培などに注力できるようにしたい",
  note:"最初に、これを読ませてください。シートの最後に書いてくださった言葉です。『今は枝葉の作業に追われているのでもっと栽培などに注力できるようにしたい』。これ、ご自分で書かれてますよね。僕が今日やることは、新しい問題を見つけることではなくて、馬場さんがもう書かれているこの『枝葉に追われている』を、その場で並べ直すことです。※責める言い方にしない。『自分で言語化できている人は強い』という温度で読む。"},
 {kicker:"確認させてください", h:"勤めをしながら、<br>朝と夜で回しておられます", sub:"「朝5時から7時半まで」「午後 仕事から帰ってからの5時から7時まで」——1日4時間半。これを毎日やれている人は、そう多くありません。",
  note:"もうひとつ、読ませてください。『今は朝5時から7時半までと、午後仕事から帰ってからの5時から7時までやっています』。朝2時間半、夜2時間。合わせて1日4時間半です。勤めをしながら、これを毎日やれている方は、そう多くありません。ここは今日の話の前提として置かせてください。まず聞きたいのですが、この4時間半、いま何にどれくらい使われていますか。"},

 {kicker:"今日いちばん聞きたいこと", h:"詰まっている所を、<br>1つずつ聞かせてください",
  diagram:`<div class="worrycards">
    <div class="wcard"><div class="wc-h">① 道具</div><div class="wc-b"><b>広さに見合った設備や<br>機具が揃っていない</b></div></div>
    <div class="wcard"><div class="wc-h">② 時間</div><div class="wc-b"><b>枝葉の作業に<br>追われている</b></div></div>
    <div class="wcard"><div class="wc-h">③ 畑</div><div class="wc-b"><b>27アールのうち<br>使えるのは10アール</b></div></div>
  </div>`,
  note:"シートを読ませていただいて、詰まっている所が3つ見えました。1つ、広さに見合った設備や機具が揃っていない。2つ、枝葉の作業に追われている。3つ、27アールあるうち実際に使えるのは10アールくらい。この3つを、1つずつ、少し細かく聞かせてください。ここが今日の前半の中心です。ゆっくりで大丈夫です。※ここから3枚、15分ほど使って聞く。答えを返そうとしない・遮らない。"},

 {kicker:"深掘り ①", h:"どの作業で、道具が<br>足りないと感じますか", sub:"手が止まる場面が分かると、買うべき物と、買わなくていい物が分かれます。",
  note:"【深掘りの問い・3つ】<b>①</b> どの作業のときに『道具が無いな』と一番感じますか。耕すときですか、畝を立てるときですか、収穫や運ぶときですか。<b>②</b> それが無いことで、1日のうちどれくらい余分に時間がかかっていますか。<b>③</b> 逆に、いま持っている道具は何がありますか。<br>——さらに聞けるなら：借りられる物はありますか（ご近所・親戚・JA）／過去に買って使わなかった物はありますか。<br>★ここは答えを返さない。『買いましょう』とも『買わなくていい』とも言わない。仕分けは後の段でやる。"},
 {kicker:"深掘り ②", h:"「枝葉の作業」って、<br>何のことですか", sub:"今日いちばん大事な所です。ご本人の言葉で、具体を聞かせてください。",
  note:"【深掘りの問い・3つ】<b>①</b> 『枝葉の作業』と書かれていましたが、具体的にはどんな作業ですか。<b>②</b> 1日4時間半のうち、その枝葉に何時間 取られていますか。<b>③</b> それは、やらないと本当にまずい作業ですか。それとも『気になるからやっている』作業ですか。<br>——さらに聞けるなら：ご家族はどの作業を手伝われていますか／馬場さんでないとできない作業はどれですか。<br>★ここが後半の『絞る』への橋になる。時間を増やす話にしない。<b>何をやめるか</b>の話に持っていく。"},
 {kicker:"深掘り ③", h:"残りの17アールは、<br>何が起きていますか", sub:"使えていない理由が「道具」なのか「時間」なのか「畑そのもの」なのかで、打つ手が変わります。",
  note:"【深掘りの問い・3つ】<b>①</b> 使えていない17アールは、何が理由で使えていませんか。草ですか、石ですか、水ですか、それとも単純に手が回らないからですか。<b>②</b> その17アールは、今年 使う予定ですか。それとも来年以降ですか。<b>③</b> もし今 使えるようになったとして、そこに手を掛ける時間はありますか。<br>——さらに聞けるなら：畑は1か所にまとまっていますか／家から徒歩3分と書かれていましたが、17アールも同じ場所ですか。<br>★『広げましょう』に流れない。今日は<b>10アールの中身</b>を濃くする話に持っていく。"},

 {kicker:"確認させてください", h:"1年後の願いも、<br>書いてくださいました", quote:"収益の見積りがたてられて、作付け計画を回していけて、運営が成り立つ状態",
  note:"1年後どうなっていたいか、で、こう書いてくださいました。『収益の見積りがたてられて、作付け計画を回していけて、運営が成り立つ状態』。——これ、実はすごく具体的なんです。見積りが立つ、計画が回る、運営が成り立つ。3つ並んでいます。この3つの中で、どれが一番先に要りますか。もう1つ聞かせてください。今、この3つのうち、少しでもできているものはありますか。"},
 {kicker:"確認させてください", h:"いま居る場所は、<br>ここで合っていますか", sub:"申込では「1. 生産の安定」を選んでくださいました。シートの中身も、全部そこを指しています。ここは、ずれていません。",
  note:"ここ、今日いちばん大事な確認です。申込のときに『1. 生産の安定』を選んでくださいました。そしてシートの中身、道具のこと、枝葉のこと、使えていない畑のこと、全部そこを指しています。つまり馬場さんは、行きたい場所と、いま居る場所が、ずれていません。これは強いです。なぜこれを言うかというと、順番を間違える方の多くは、行きたい場所ばかり見て、いま居る場所を見ていないからです。そして現在地って、自分が一番見えないんですよ。僕もそうでした。馬場さんはそこが見えている。だから今日は、その先の順番の話ができます。"},

 {kicker:"ポイント", h:"この3つ、順番を決めれば<br>外せます。聞いてみますか？", sub:"新しい道具を足す話ではありません。いま持っているものを、どの順で触るかの話です。",
  note:"【テストクロージング①・軽く】ここまで聞かせていただいて、この3つは順番を決めれば外せる、と僕は思っています。新しい道具を足す話ではなくて、いま持っているものをどの順で触るか、という話です。その順番の話、聞いてみますか？——『はい』をいただいてから次へ。押さない。"},

 /* ===== 中盤＝順番の考え方 ===== */
 {kicker:"考え方", h:"悩みは、3つのどれかに<br>仕分けるところから", pts:["安定 … 読める量が作れているか","売り先 … 誰に・なぜ選ばれ・続くか","拡大 … 面積・人・設備"],
  note:"まず、出てきた悩みをそのまま打ち手にしないことです。『これは安定の話か、売り先の話か、拡大の話か』に置き直す。置き直した時点で、次にやることの優先度が変わります。馬場さんの『設備や機具が揃っていない』は、一見すると拡大の話に見えます。でも、いま使えているのは10アールで、そこで読める量が作れていないなら、これは安定の話なんです。表面の悩みと、本当に稼げなくなっている原因は、ずれていることが多い。悩みの仕分けが、最初の一手です。"},
 {kicker:"考え方", h:"行きたい場所ではなく、<br>いま居る場所を見る", sub:"目標も、選んだ番号も「行きたい場所」。決め手になるのは、いま居る場所です。そして現在地は、自分が一番見えません。",
  note:"目標も、選んだ番号も、行きたい場所です。決め手になるのは、いま居る場所。そして現在地は本人が一番見えない。僕自身も最初は一人で考えて、順番を間違えて10年遠回りしました。知識も情報もあったんです。でもそれを自分の畑に、自分に合う形にできなかった。だから他人と突き合わせる意味があります。"},

 {kicker:"ここを考えたいです", h:"「安定」って、<br>何と何でできていますか",
  diagram:`<div class="qbig xl">安定 ＝ <span class="q">？</span> ＋ <span class="q">？</span></div>
  <div class="note-in">馬場さんなら、この2つに何を入れますか。</div>`,
  note:"【2枚組の1枚目・ここは必ず本人に答えさせる】ちょっと質問させてください。『生産の安定』って、何と何でできていると思いますか。この2つの丸に、馬場さんなら何を入れますか。——先に答えを言わない。10秒でも20秒でも待つ。出てきた答えは否定せず、そのまま拾って次の1枚へ。『それも入りますね、僕の場合はこう置いています』とつなぐ。"},
 {kicker:"僕の答えです", h:"僕は、この2つで<br>できていると思っています",
  diagram:`<div class="qbig">安定 ＝ <span class="q">反収向上</span> ＋ <span class="q">反収の安定</span></div>
  <div class="note-in">面積を増やすことも、道具を増やすことも、安定そのものではありません。</div>`,
  note:"【2枚組の2枚目・答え】僕の答えはこれです。反収が上がって、それが毎年ブレずに出る。この2つです。反収というのは、1アールあたり、1反あたりでどれだけ穫れるか、ということです。面積を増やすことも、道具を増やすことも、それ自体は安定ではありません。この2つが無いまま面積や道具を増やすと、増えるほど手が回らなくなって、判断が重くなって動けなくなります。馬場さんの27アールのうち17アールが使えていない、というのは、まさにその形なんです。"},
 {kicker:"ここが山です", h:"「道具が無いから広げられない」<br>——順番が逆です", sub:"道具を買ってから安定させるのではなく、いまの10アールで読める量を作る。そこから、必要な道具がはっきりします。",
  note:"【今日いちばん伝えたい所・ゆっくり】たぶん今、こういう順で考えておられると思うんです。道具が無い → だから広い面積を回せない → だから量が出ない → だから稼げない。——これ、順番が逆にできます。まず、いまの10アールで読める量を作る。そうすると、『この作業でこれだけ時間がかかっている、だからこの道具が要る』というのが数字で出てくるんです。順番が逆だと、何を買えばいいか分からないまま買うことになります。僕自身、50万・100万を投じて使えなかった機械が倉庫に眠っています。場所も取るし、売れないし、雨ざらしにすれば朽ちる。ここが、今日いちばん持って帰っていただきたいところです。"},
 {kicker:"考え方", h:"品目が多いほど、<br>反収は読めなくなります", sub:"いま9品目。秋にさらに5品目。1つ1つに手を掛ける時間が割れて、どれも「去年どうだったか」が残りません。",
  note:"シートを数えさせていただきました。今、キュウリ、茄子、ミニトマト、さつまいも、落花生、オクラ、里芋。それに秋、じゃがいも、ブロッコリー、レタス、春菊、大根を考えておられる。——これ、悪いことではないんです。作りたい気持ちが強い方ほどこうなります。僕もそうでした。ただ、品目が多いほど、1つ1つに手を掛ける時間が割れて、『去年これがどうだったか』が残らないんです。残らないと、来年 読めない。読めないから、見積りが立たない。馬場さんが書かれた『収益の見積りがたてられて』が遠いのは、実はここが理由です。"},
 {kicker:"ここが いちばん厳しい所", h:"作れない作物・収益の上がらない作物に<br>分散していること自体が、厳しい",
  sub:"そのままでは、全然 伸びません。ここは正直に置かせてください。",
  note:"ここ、正直に言わせてください。作れない作物、収益の上がらない作物を たくさん出そうとして 分散していること自体が、まず かなり厳しいんです。そのままでは、全然 伸びないです。——春のトウモロコシが ほぼほぼ育たなかった、と書いてくださいましたよね。あれは 馬場さんの腕の話ではなくて、14品目に手が割れている中の1つだった、という話だと思っています。作れない物を切るのは、あきらめではありません。作れる物に時間を戻す、ということです。"},

 {kicker:"考え方", h:"横ばいは、現状維持ではなく<br>下がっています", sub:"だから「何を足すか」より、「今年やらないことを何にするか」の方が効きます。",
  note:"農業は、売上が伸びていかないと現状維持ではなく衰退と同じです。横ばいは止まっているのではなく、下がっている。だから何を足すかより、何を今年やらないと決めるかの方が効きます。馬場さんの場合、これがそのまま『枝葉の作業に追われている』の答えになります。時間が足りないのではなくて、やることが多すぎるんです。"},

 /* ===== 実績 ===== */
 {kicker:"実績", h:"1日実働 約5時間。<br>長く働いた結果ではありません", sub:"朝9時から14時。順番を決めて、そのつど仕組みに変えてきた結果です。",
  note:"実績の話を少しだけさせてください。今、1日実働 約5時間です。朝9時から14時。馬場さんの4時間半と、そんなに変わらないんですよ。違うのは時間の長さではなくて、その中で何をやっているか、です。長く働いた結果ではなくて、準備・販路・技術改善を、そのつど仕組みに変えてきた結果です。"},
 {kicker:"実績", h:"年間100t超。<br>2026年は200tも視野に", sub:"最初から100tだったわけではありません。読める量を作るところから始めています。",
  note:"量で言うと、年間100t超まで来ました。2026年は200tも視野に入っています。ただ、最初から100tだったわけではありません。まず読める量を作る、そこからです。"},
 {kicker:"実績", h:"大不作の年でも、<br>3日で1ヶ月分を回収", sub:"2024年、全国的な大不作の年。多くの生産者が出せない中で、3日間で1ヶ月分の売上を回収しました。運ではありません。",
  note:"2024年、全国的な大不作の年がありました。多くの生産者が出せない中で、3日間で1ヶ月分の売上を回収しました。運ではなくて、作る前・売る前・届ける前に準備が整っていたからです。本人としては、一人勝ちというより生き残れた、という感覚です。"},
 {kicker:"実績", h:"産地化と、3年連続の表彰", sub:"愛知で初めて有機JASのニンジンを産地化。別の作物で3年連続の表彰。発芽率は70%から95%以上へ。",
  note:"愛知で初めて有機JASのニンジンを産地化しました。表彰は、それとは別に、ニンジン・白菜・キャベツで3年連続いただいています。発芽率も70%から95%以上に上げました。順番と改善の積み重ねです。この発芽率の話、馬場さんの『春はトウモロコシをして、ほぼほぼ育たなかった』と同じ所の話です。"},
 {kicker:"僕の話", h:"僕も、順番を間違えて<br>10年 遠回りしました", sub:"売り先を先に作ろうとして、納品2週間前に量が半分。取引先に電話するのに手が震えました。怖くて当然なんです。",
  note:"偉そうに言っていますが、僕も最初は順番を間違えました。売り先を先に作ろうとして、納品2週間前に出せる量が半分しかなくて、取引先に謝る電話をするとき手が震えました。補助金も投資に回せず生活費に消えた。ニンジンをほぼ腐らせて、その病気の名前すら知らなかった。一人で考えて10年 遠回りしました。だから、同じ間違いをしてほしくないんです。"},

 /* ===== 300万を階段に分ける ===== */
 {kicker:"300万の話", h:"年300万。<br>まず、いまいくらですか", sub:"目標だけがあると、遠すぎて動けません。現在地の数字を一度、口に出して置いてみてください。",
  note:"【必ず本人に数字を言ってもらう】シートに『農業でいくら稼ぎたいか』で年300万と書いてくださいました。いい目標です。ただ、目標だけがあると遠すぎて動けないんですよ。なので一度、現在地を教えてください。今、直売所への出荷で、月にどのくらいになっていますか。——数字が出たら否定も評価もしない。『分かりました、ではそこからの階段を作りましょう』と受ける。数字を言いたくない様子なら『ざっくりで大丈夫です、桁だけでも』と言い換える。〔当日 記入〕この数字は、こちらの記録には無い。推測で埋めない。"},
 {kicker:"300万の話", h:"300万は、1段では登れません",
  diagram:`<div class="steps">
    <div class="step s1"><div class="n">いま</div><div class="v">〔当日<br>記入〕</div></div>
    <div class="step s2"><div class="n">1段目</div><div class="v">？</div></div>
    <div class="step s3"><div class="n">2段目</div><div class="v">？</div></div>
    <div class="step s4"><div class="n">その先</div><div class="v">300万</div></div>
  </div>`,
  note:"300万は、1段では登れません。階段に分ける必要があります。いま ここ、次はここ、その次はここ、そして300万。この階段を、今日 一緒に引きます。大事なのは、次の1段をいくらに置くかです。いきなり300万を見ずに、次の1段だけを見る。※空欄は当日 本人の数字で埋める。こちらから金額を提案しない（うちの記録に馬場さんの数字は無い）。"},
 {kicker:"300万の話", h:"1段目は「1品目の反収を上げる」。<br>では、その1品目をどう決めるか", sub:"ここが、今日いちばんお伝えしたい所です。1品目は、当てずっぽうでは決まりません。",
  diagram:`<div class="steps">
    <div class="step s1"><div class="n">①</div><div class="v">直売所の売上の<br>データを取る</div></div>
    <div class="step s2"><div class="n">②</div><div class="v">直売所以外の<br>出荷先を見つける</div></div>
    <div class="step s3"><div class="n">③</div><div class="v">出荷先が決まると<br>作る1品目が決まる</div></div>
    <div class="step s4"><div class="n">④</div><div class="v">その1品目の<br>反収を上げる</div></div>
  </div>`,
  note:"1段目は、1品目の反収を上げること。ここは変わりません。ただ、今日いちばんお伝えしたいのは、その1品目を いかに決めるか、なんです。順番はこの4つです。①まず、直売所の売上のデータを取る。②直売所以外の出荷先を見つける。③出荷先が決まると、作る1品目が決まる。④その1品目の反収を上げる。——④だけ先にやろうとすると、どの品目に賭けるかが勘になります。①から順に行きます。1枚ずつ見ていきましょう。"},

 {cls:"detaslide", kicker:"① データを取る", h:"まず、直売所の売上の<br>データを取ります", sub:"何が・いくらで・いつ売れたか。この3つだけ。ここが無いと、あとの話が全部 勘になります。",
  pts:["何が売れたか（品目）","いくらで売れたか（単価と金額）","いつ売れたか（曜日・時期）"],
  note:"①です。まず、直売所の売上のデータを取ってください。これは僕が持っていない数字で、馬場さんにしか出せません。今、JA直売所へ オクラ・茄子・キュウリを 日に2〜3袋 出しておられますよね。その1袋ずつが、何が・いくらで・いつ売れたか。この3つだけでいいです。直売所の精算書でも、アプリでも、手書きのノートでも構いません。——これ、今日の帰りからできます。ここが無いまま『何を作ろうか』を考えると、全部 勘になるんです。次の面談までに、この3つを持ってきていただけますか。※本人に出してもらう数字。こちらで作らない。"},

 {kicker:"② 出荷先を見つける", h:"次に、直売所以外の<br>出荷先を見つけます", sub:"直売所出荷を続けるのは、全然いいんです。ただ、それで先が見えるかどうか。",
  note:"②です。まず第一にやるべきことは、直売所出荷【以外】の出荷先を見つけていくことです。——直売所出荷をやっていこうとするのは、全然いいんです。悪いとは1つも思っていません。ただ、それで先が見えるかどうか、なんです。日に2〜3袋を、直売所という1本だけで積み上げていった時に、1年後の数字が読めるか。ここを一緒に考えたいです。そして出荷先を探す時に、当てずっぽうで探さなくていいんです。この地域で、実際に何がいくら売れているか。次の3枚で、それを見ます。"},

 {cls:"detaslide", kicker:"② の材料｜JAおおいがわ 品目ごとの販売取扱高", h:"地元の農協は、何が いくら<br>売れているか（合計 74.8億円）",
  pts:["茶 23.0億円","まんさいかん（直売所4店） 18.1億円","野菜 16.2億円","花卉 5.3／耕種 4.0／肉用牛 3.9／みかん 1.3（億円）"],
  diagram:`<div class="deta">出典＝大井川農業協同組合「JA OOIGAWA DISCLOSURE 2026」64ページ「販売事業取扱実績」令和7年度（2025年4月〜2026年3月）</div>`,
  note:"②の材料の1枚目。馬場さんの地元の農協、JAおおいがわが、何をいくら売っているかです。合計74.8億円。いちばん大きいのが茶で23.0億円。次が まんさいかん、つまり直売所4店で18.1億円。その次が野菜で16.2億円。花卉5.3億、耕種4.0億、肉用牛3.9億、みかん1.3億。——出どころは、JAが自分で出しているディスクロージャー誌の64ページ、令和7年度の販売事業取扱実績です。ここ、面白いのが、前の年と比べると 茶が8億8千万 増えて63%増、逆に野菜は3億1千万 減って16%減なんです。動いている市場だ、ということです。※JAの表は『野菜』『耕種』までで、いちご・トマト・レタスなど品目ごとの内訳は公表されていない＝その先は聞きに行く所。"},

 {cls:"detaslide", kicker:"② の材料｜焼津市の農業産出額 38億9千万円", h:"焼津は、野菜と米の市です。<br>お茶の市では ありません",
  pts:["野菜 15億5千万円（いちばん大きい）","米 10億4千万円","畜産 8億1千万円（うち鶏卵 7億1千万円）","果実 2.5／花き 1.8／茶 0（億円）"],
  diagram:`<div class="deta">出典＝農林水産省「令和5年 市町村別農業産出額（推計）」静岡県（e-Stat）<br>https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040260604&amp;fileKind=4</div>`,
  note:"②の材料です。焼津市の農業産出額は38億9千万円。いちばん大きいのが野菜で15億5千万円。次が米で10億4千万、畜産8億1千万、果実2億5千万、花き1億8千万。そしてお茶はほぼゼロです。——農林水産省の市町村別農業産出額の推計、令和5年の数字です。ここ、大事なんですけど、静岡と言うとお茶のイメージですよね。でも焼津市に限っては、お茶ではなくて野菜と米の市なんです。隣の島田市は茶が20億6千万、牧之原市は21億5千万ありますが、焼津はほぼゼロ。——つまり馬場さんが作っておられるキュウリ・茄子・ミニトマトは、この市でいちばん太い列に乗っています。土地が合わない物を作っておられるわけではありません。※市のサイトは令和3年の35億5千万を載せている。年度を混ぜて話さない。"},

 {cls:"detaslide", kicker:"② の材料｜この地域で 実際に売れている品目", h:"当てずっぽうで<br>探さなくていいんです",
  pts:["主な農産物＝トマト・いちご・レタス・キャベツ・ネギ・キュウリ","トマトは昭和41年から 国の産地指定","いちごは 志太地域の約4割が焼津市","静岡県＝いちご126億・トマト63億・レタス40億"],
  diagram:`<div class="deta">出典＝焼津市「焼津の農産物」 https://www.city.yaizu.lg.jp/business/suisan-nougyo/agriculture/yaizu-products.html<br>／ 農林水産省「令和5年 生産農業所得統計」表4-1（e-Stat）</div>`,
  note:"②の材料の2枚目です。焼津市が自分で出している『焼津の農産物』に、主な農産物が並んでいます。トマト、いちご、レタス、キャベツ、ネギ、キュウリ、セルリー。トマトは昭和41年、1966年から国の産地指定を受けている、と市が書いています。いちごは志太地域の生産の約4割が焼津市。——県ぜんたいの品目別で見ると、いちごが126億円で全国5位、トマトが63億円、レタスが40億円で全国4位。令和5年の生産農業所得統計です。ここに、馬場さんのキュウリも、秋に考えておられるレタスも、両方 名前が出ています。出荷先を探す時に、この列から選ぶと受け皿がある確率が高い、ということです。"},

 {cls:"detaslide", kicker:"② の材料", h:"直売所以外の受け皿は、<br>この地域に ちゃんと在ります", pts:["学校給食＝焼津市学校給食センターは 1日9,591食（22校）","加工＝静岡県の農産加工 年間販売額 622億円・全国2位","ふるさと納税＝焼津市は 制度の対象自治体","産直EC＝食べチョク（静岡県のページに県内の生産者が掲載）"],

 /* ===== よくある不安（前の回のS41-44と同じ位置に足した分）===== */
 {kicker:"よくある不安", h:"「使えるお金が<br>月2万円しかない」", sub:"年24万円。肥料と種は買えます。そして今日の①〜④は、1円もかからない打ち手です。",
  note:"よくいただく不安に、先にお答えします。1つ目、お金です。月2万円しかない、と。——さっき申し上げたとおり、年間24万円です。肥料と種は買えます。そして、今日お話しした①データを取る、②出荷先を見つける、③1品目を決める。ここまでは1円もかかりません。お金が少ない方ほど、順番が命なんです。大きい投資を先にしないで済む順番を選ぶ。逆に言うと、お金がある方は順番を間違えても機械で埋められてしまう。馬場さんは、埋められない。だから順番で行きます。"},
 {kicker:"よくある不安", h:"「勤めがあるので、<br>続けられるか不安」", sub:"増やすのは時間ではなく、順番です。朝5時から動けている時点で、時間の側は足りています。",
  note:"2つ目、時間です。勤めがあるので続けられるか、と。——僕は今、1日実働 約5時間です。馬場さんは朝2時間半と夜2時間で4時間半。ほとんど変わらないんですよ。違うのは長さではなくて、その中で何をやっているか、です。増やすのは時間ではなく、順番です。それに、勤めながら朝5時から動けている方が『続けられない』ということは、僕はまず無いと思っています。続かないのは、やることが多すぎる時です。だから、やめる物を決めます。"},
 {kicker:"よくある不安", h:"「また、育たなかったら<br>どうしよう」", sub:"春のトウモロコシ。あれは腕の話ではありません。原因が残っていないから、次に活かせなかっただけです。",
  note:"3つ目。これがいちばん多いかもしれません。また育たなかったらどうしよう、と。——春のトウモロコシが ほぼほぼ育たなかった、と書いてくださいましたよね。僕は、あれは馬場さんの腕の話ではないと思っています。14品目に手が割れていて、どこで何が起きたかの記録が残らなかった。だから次に活かせなかった。それだけです。僕自身、発芽率は70%でした。そこから95%以上に上げています。上がったのは、根性ではなくて、1つに絞って記録を残したからです。1品目に絞って毎日1行 書く、というのは、そのための宿題なんです。"},

S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.cls?(' '+s.cls):'');
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  inner+=`<h1>${s.h}</h1>`;
  if(s.sub) inner+=`<div class="sub">${s.sub}</div>`;
  if(s.quote) inner+=`<div class="quote">「${s.quote}」</div>`+(s.subq?'':'');
  if(s.sub&&s.quote){}
  if(s.pts){inner+='<ul class="pts">'+s.pts.map(p=>`<li>${p}</li>`).join('')+'</ul>';}
  if(s.diagram) inner+=s.diagram;
  if(s.tag) inner+=`<div class="tag">${s.tag}</div>`;
  if(s.who) inner+=`<div class="who">${s.who}</div>`;
  inner+=`<div class="foot">稼げる農業の仕組み化 伴走プログラム</div>`;
  d.innerHTML=inner;
  d.dataset.note=s.note||'';
  stage.appendChild(d);
});

/* ★入り切らない枚を【縮めずに 2枚へ割る】（ご主人様2026-08-17「細かい文字はだめ」）
   割る所＝箇条書きの最後の1行から。割った先の見出しは「（つづき）」を付ける。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display='flex';
    var ng = el.scrollHeight > el.clientHeight + 2;
    el.style.display = m;
    return ng;
  }
  var stage = document.getElementById('stage');
  var mawaru = 0;
  while (mawaru < 40) {
    var s = stage.querySelectorAll('.slide');
    var watta = false;
    for (var i = 0; i < s.length; i++) {
      var el = s[i];
      if (!afureteru(el)) continue;
      var ul = el.querySelector('ul.pts');
      if (!ul || ul.children.length < 2) continue;      /* 割れない枚は そのまま */
      var atarashii = el.cloneNode(true);
      /* ★ご主人様2026-08-17 18:08「中川一郎なんとか、中川一郎なんとかって【連呼】されている。
         タイトルは1回で良い。その後は中身を伝えていけばいい」
         ＝割った先で 大きい見出しを もう一度 出すのをやめる。
         　小さい行（kicker）に「◯◯（つづき）」と置くだけにする。 */
      /* ★ご主人様2026-08-17 18:15（本人の文字・そのまま）
         「**(つづき)いらない／全てつづき**」「**全て続きだから そんな表記はいらない。要らぬお世話**」
         ＝割った先の枚では **見出しも（つづき）の表記も 出さない**。中身だけ続ける。 */
      var h = atarashii.querySelector('h1,h2');
      if (h) { h.remove(); }
      /* 新しい方＝最後の1行だけ残す／元の方＝最後の1行を落とす */
      var nul = atarashii.querySelector('ul.pts');
      while (nul.children.length > 1) { nul.removeChild(nul.firstElementChild); }
      var sub = atarashii.querySelector('.sub'); if (sub) { sub.remove(); }
      var q = atarashii.querySelector('.quote'); if (q) { q.remove(); }
      ul.removeChild(ul.lastElementChild);
      atarashii.classList.remove('active');
      el.parentNode.insertBefore(atarashii, el.nextSibling);
      watta = true;
      break;
    }
    if (!watta) break;
    mawaru++;
  }

  /* ★割れない枚（表紙・カード・大きい数字など）だけ、最後の手段で文字を落とす。
     ただし【元の大きさより小さくはしない】＝BAI 倍ぶんの余地の中だけで詰める。 */
  var s2 = stage.querySelectorAll('.slide');
  for (var k = 0; k < s2.length; k++) {
    var el2 = s2[k];
    var kai = 0;
    var nokori = 1 / 1.500;               /* ここまでしか小さくしない（＝元の大きさ） */
    var ima = 1.0;
    while (afureteru(el2) && kai < 12 && ima > nokori + 0.001) {
      var m2 = el2.style.display; el2.style.display = 'flex';
      var r = Math.max(0.94, el2.clientHeight / el2.scrollHeight);
      if (ima * r < nokori) { r = nokori / ima; }
      var ko = el2.querySelectorAll('*');
      for (var j = 0; j < ko.length; j++) {
        var cs = window.getComputedStyle(ko[j]);
        var f = parseFloat(cs.fontSize);
        if (f > 0) { ko[j].style.fontSize = (f * r) + 'px'; }
        var mt = parseFloat(cs.marginTop);
        if (mt > 0) { ko[j].style.marginTop = (mt * r) + 'px'; }
        var g = parseFloat(cs.rowGap);
        if (g > 0) { ko[j].style.rowGap = (g * r) + 'px'; }
      }
      var sp = parseFloat(window.getComputedStyle(el2).paddingTop);
      if (sp > 8) { el2.style.paddingTop = (sp * r) + 'px'; el2.style.paddingBottom = (sp * r) + 'px'; }
      el2.style.display = m2;
      ima = ima * r;
      kai++;
    }
  }
})();
let cur=0;const slides=[...document.querySelectorAll('.slide')];
const counter=document.getElementById('counter');
const noteBox=document.getElementById('note');let noteOn=false;
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  counter.textContent=(cur+1)+' / '+slides.length;
  if(noteOn){noteBox.innerHTML='<b>🎙 トーク台本（発表者のみ）：</b> '+(slides[cur].dataset.note||'—');}
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);}
  else if(e.key.toLowerCase()==='n'){noteOn=!noteOn;noteBox.classList.toggle('show',noteOn);show(cur);}
  else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
});
stage.addEventListener('click',()=>show(cur+1));
const _h=parseInt((location.hash||'').slice(1),10);
show(isNaN(_h)?0:_h);
</script>

<script>
// ★箱ごと 画面に収まるだけ拡大／縮小する
// ★zoom を使う：transform は .slide.active の fade の keyframe が
//   transform:none で上書きするので 効かなかった（実測して分かった）
(function(){
  function fit(){
    var k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    var s = document.querySelectorAll('.slide');
    for (var i = 0; i < s.length; i++) { s[i].style.zoom = k; }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  document.addEventListener('keydown', function(){ setTimeout(fit, 10); });
  document.addEventListener('click', function(){ setTimeout(fit, 10); });
  window.addEventListener('load', fit);
  setTimeout(fit, 30);
  setInterval(fit, 800);
})();
</script>

<script>
/* ★はみ出しの【最後の1回】＝字が全部そろってから もう一度 見る。
   元の紙の縮め方は 読み込みの途中で1回だけ走る＝字が後から届くと 3〜6px はみ出したまま残る。
   （実測＝92枚中5枚が 3〜6px はみ出していた）。ここでは 残った分だけ 0.98倍ずつ詰める。
   ★見本のCSSも 元の script も さわっていない。後ろに足しただけ。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display = 'flex';
    var ng = el.scrollHeight > el.clientHeight + 1;
    el.style.display = m;
    return ng;
  }
  function tsumeru(){
    var s = document.querySelectorAll('.slide');
    for (var i = 0; i < s.length; i++) {
      var el = s[i], kai = 0;
      while (afureteru(el) && kai < 25) {
        var m = el.style.display; el.style.display = 'flex';
        var ko = el.querySelectorAll('*');
        for (var j = 0; j < ko.length; j++) {
          var cs = window.getComputedStyle(ko[j]);
          var f = parseFloat(cs.fontSize);
          if (f > 0) { ko[j].style.fontSize = (f * 0.98) + 'px'; }
          var mt = parseFloat(cs.marginTop);
          if (mt > 0) { ko[j].style.marginTop = (mt * 0.98) + 'px'; }
          var g = parseFloat(cs.rowGap);
          if (g > 0) { ko[j].style.rowGap = (g * 0.98) + 'px'; }
        }
        el.style.display = m;
        kai++;
      }
    }
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function(){ setTimeout(tsumeru, 60); }); }
  window.addEventListener('load', function(){ setTimeout(tsumeru, 300); });
  setTimeout(tsumeru, 1200);
})();
</script>
