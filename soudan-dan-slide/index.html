<style>
  :root{ --green:#2e7d32; --green-d:#1b5e20; --ink:#12200f; --paper:#f6f8f3; --gold:#b8892b; --line:#dfe6d8; }

  html,body{height:100%;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#0e1410;color:var(--ink);overflow:hidden;}

  .cover .kicker{color:var(--green);}

  #counter{position:fixed;right:38.4px;bottom:32.4px;font-size:40.5px;font-weight:700;color:#2e7d32;background:rgba(255,255,255,.85);

  #stage{overflow:hidden;}
  .slide{overflow:hidden;}
  .slide.active{animation:none !important;}
  body{-webkit-text-size-adjust:100%;}

<body>
<div id="stage"></div>
<div id="counter"></div>
<div id="hint">← → めくる｜ N=トーク台本の表示切替（画面共有中は押さない）</div>
<div id="note"></div>

<!-- ★段を選ぶ画面＝画面共有を始める【前】に押して消す。相手には出ません。
     ★はじめから hide が付いています＝押した後に画面を更新しても、この画面は【出ません】。
       出どころ＝Codexの指摘（2026-09-01）「共有中に更新・タブ復元で選ぶ画面が相手に見える」。
       押した番号を この端末に覚えさせて、6時間 経つまでは 出さない作りにした。 -->
<div id="danpick" class="hide">
  <div class="dp-t">相談を始める前に、この方の「いまの現状」の番号を押してください</div>
  <div class="dp-s">申込みの整理シートに書いてある番号です。押すと この画面は消えて、相談用のスライドだけになります。<br>
    ★<b>押してから 画面共有を始めてください。</b>URLは1文字も変わりません（アドレスバーに番号は出ません）。</div>
  <div class="dp-row" id="dp-dan"></div>
  <div class="dp-note">
    ★話しているうちに現状がずれた時は、<b>キーボードの 1・2・3</b> を押すと、その場で山の2枚だけが入れ替わります。<br>
    画面はめくれません・何も表示は出ません・相手には気づかれません。<br>
    1＝まず体で入る／2＝売り先が先／3＝いま居る場所を見る
  </div>
  <div class="dp-kenpin" id="dp-kenpin">検品中…</div>
</div>
<script>
/* ★この1つだけ 先に走らせる＝選ぶ画面を【出すかどうか】を、絵が出る前に決める。
   ・前に押した番号が この端末に残っていて、押してから6時間 経っていない → 出さない
     （＝画面共有の途中で更新しても、タブが復元されても、相手に見えません）
   ・番号が無い／6時間 経った → 出す（＝次の相談の時は ちゃんと選び直せます） */
(function(){
  var AKERU = 6 * 60 * 60 * 1000;   /* 6時間 */
  var k = null;
  try {
    var raw = window.localStorage.getItem('soudan_yama');
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.k && (Date.now() - o.t) < AKERU) { k = o.k; }
    }
  } catch (e) { k = null; }
  window.__YAMA_HOZON = k;
  if (!k) { document.getElementById('danpick').classList.remove('hide'); }
})();
</script>

<script>
/* ============================================================
   農業相談会スライド｜段で山を入れ替える1本（2026-09-01）

     1) 山（今日いちばん持って帰ってもらう1枚）＋その次の1枚 が、現状の番号で入れ替わる

    {kicker:"その次にやる事", h:"どこへ行くか、決めましょう",
     pts:["アプリ「ノウハウ」で探す（人を雇える規模しか来ません）","<ruby>農業改良普及課<rt>のうぎょうかいりょうふきゅうか</rt></ruby>から、人づてに紹介してもらう","「いろんな作業を教えてください」と言って入る"],
     note:"では、どこへ行くか。1つ、ノウハウというアプリがあります。農業の農に、英語のハウです。ここは人を雇える規模の農家しか募集を出しませんので、行けば その規模が見えます。2つ、農業改良普及課。県の事務所です。ここで作物の話を聞くと、この農家さんに聞いてみたら、と紹介してもらえます。師匠を誰にするかが、ここで決まります。3つ、作りたい物がもう決まっているなら、その作物の農家へ。——そして入ったら、いろんな作業を教えてくださいと言ってください。前向きな農家なら、どんどん任せてくれます。僕もそうです。★ここで相手が乗ってきたら、次の枚へ急がずに 会話を続ける。"}

  B: [
    {kicker:"ここが山です", h:"「何を作るか」より先に<br>「どこへ売るか」",

/* ★入り切らない枚を【縮めずに 2枚へ割る】（ご主人様2026-08-17「細かい文字はだめ」）
   割る所＝箇条書きの最後の1行から。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display='flex';
    var ng = el.scrollHeight > el.clientHeight + 2;
    el.style.display = m;
    return ng;
  }
  var stage = document.getElementById('stage');
  var mawaru = 0;
  while (mawaru < 40) {
    var s = stage.querySelectorAll('.slide');
    var watta = false;
    for (var i = 0; i < s.length; i++) {
      var el = s[i];
      if (!afureteru(el)) continue;
      var ul = el.querySelector('ul.pts');
      if (!ul || ul.children.length < 2) continue;      /* 割れない枚は そのまま */
      if (el.dataset.yama !== undefined) continue;      /* ★山の枚は割らない（入れ替えるので位置を動かさない） */
      var atarashii = el.cloneNode(true);
      /* ★ご主人様2026-08-17 18:15「(つづき)いらない／全てつづき」
         ＝割った先の枚では 見出しも（つづき）の表記も 出さない。中身だけ続ける。 */
      var h = atarashii.querySelector('h1,h2');
      if (h) { h.remove(); }
      var nul = atarashii.querySelector('ul.pts');
      while (nul.children.length > 1) { nul.removeChild(nul.firstElementChild); }
      var sub = atarashii.querySelector('.sub'); if (sub) { sub.remove(); }
      var q = atarashii.querySelector('.quote'); if (q) { q.remove(); }
      ul.removeChild(ul.lastElementChild);
      atarashii.classList.remove('active');
      el.parentNode.insertBefore(atarashii, el.nextSibling);
      watta = true;
      break;
    }
    if (!watta) break;
    mawaru++;
  }

  /* ★割れない枚だけ、最後の方法で文字を落とす。元の大きさより小さくはしない。 */
  var s2 = stage.querySelectorAll('.slide');
  for (var k = 0; k < s2.length; k++) {
    var el2 = s2[k];
    var kai = 0;
    var nokori = 1 / 1.500;
    var ima = 1.0;
    while (afureteru(el2) && kai < 12 && ima > nokori + 0.001) {
      var m2 = el2.style.display; el2.style.display = 'flex';
      var r = Math.max(0.94, el2.clientHeight / el2.scrollHeight);
      if (ima * r < nokori) { r = nokori / ima; }
      var ko = el2.querySelectorAll('*');
      for (var j = 0; j < ko.length; j++) {
        var cs = window.getComputedStyle(ko[j]);
        var f = parseFloat(cs.fontSize);
        if (f > 0) { ko[j].style.fontSize = (f * r) + 'px'; }
        var mt = parseFloat(cs.marginTop);
        if (mt > 0) { ko[j].style.marginTop = (mt * r) + 'px'; }
        var g = parseFloat(cs.rowGap);
        if (g > 0) { ko[j].style.rowGap = (g * r) + 'px'; }
      }
      var sp = parseFloat(window.getComputedStyle(el2).paddingTop);
      if (sp > 8) { el2.style.paddingTop = (sp * r) + 'px'; el2.style.paddingBottom = (sp * r) + 'px'; }
      el2.style.display = m2;
      ima = ima * r;
      kai++;
    }
  }
})();
let cur=0;const slides=[...document.querySelectorAll('.slide')];
const counter=document.getElementById('counter');
const noteBox=document.getElementById('note');let noteOn=false;
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  counter.textContent=(cur+1)+' / '+slides.length;
  if(noteOn){noteBox.innerHTML='<b>🎙 トーク台本（発表者のみ）：</b> '+(slides[cur].dataset.note||'—');}
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('danpick') && !document.getElementById('danpick').classList.contains('hide')) return; /* ★選ぶ画面が出ている間は めくらない */
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);}
  else if(e.key.toLowerCase()==='n'){noteOn=!noteOn;noteBox.classList.toggle('show',noteOn);show(cur);}
  else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
});
stage.addEventListener('click',()=>{
  if(document.getElementById('danpick') && !document.getElementById('danpick').classList.contains('hide')) return; /* ★選ぶ画面が出ている間は めくらない */
  show(cur+1);
});
const _h=parseInt((location.hash||'').slice(1),10);
show(isNaN(_h)?0:_h);
</script>

<script>
// ★箱ごと 画面に収まるだけ拡大／縮小する
(function(){
  function fit(){
    var k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    var s = document.querySelectorAll('#stage .slide');
    for (var i = 0; i < s.length; i++) { s[i].style.zoom = k; }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  document.addEventListener('keydown', function(){ setTimeout(fit, 10); });
  document.addEventListener('click', function(){ setTimeout(fit, 10); });
  window.addEventListener('load', fit);
  setTimeout(fit, 30);
  setInterval(fit, 800);
})();
</script>

<script>
/* ★はみ出しの【最後の1回】＝字が全部そろってから もう一度 見る。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display = 'flex';
    var ng = el.scrollHeight > el.clientHeight + 1;
    el.style.display = m;
    return ng;
  }
  function tsumeru(){
    var s = document.querySelectorAll('#stage .slide');
    for (var i = 0; i < s.length; i++) {
      var el = s[i], kai = 0;
      while (afureteru(el) && kai < 25) {
        var m = el.style.display; el.style.display = 'flex';
        var ko = el.querySelectorAll('*');
        for (var j = 0; j < ko.length; j++) {
          var cs = window.getComputedStyle(ko[j]);
          var f = parseFloat(cs.fontSize);
          if (f > 0) { ko[j].style.fontSize = (f * 0.98) + 'px'; }
          var mt = parseFloat(cs.marginTop);
          if (mt > 0) { ko[j].style.marginTop = (mt * 0.98) + 'px'; }
          var g = parseFloat(cs.rowGap);
          if (g > 0) { ko[j].style.rowGap = (g * 0.98) + 'px'; }
        }
        el.style.display = m;
        kai++;
      }
    }
  }
  window.TSUMERU = tsumeru;
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function(){ setTimeout(tsumeru, 60); }); }
  window.addEventListener('load', function(){ setTimeout(tsumeru, 300); });
  setTimeout(tsumeru, 1200);
})();
</script>

<script>
/* ============================================================
   ★段を選ぶ画面（相手には出ない）と、その場での入れ替え
   ・URLは1文字も変えません＝アドレスバーに番号は出ません
   ・読み込み直しもしません＝白い画面が一瞬 出ることもありません
   ・戻るボタンで選ぶ画面が出てくることもありません
   出どころ＝Codexの反証（2026-09-01）。URLに番号を付ける作りは
   　画面共有でアドレスバーに映る／戻るで選ぶ画面が出る、と指摘されたので変えた。
   ============================================================ */
(function(){
  var pick = document.getElementById('danpick');
  var row  = document.getElementById('dp-dan');

  /* --- 山の2枚を、その場で入れ替える（枚の場所は動かさない）--- */
  function yamaKirikae(k){
    YAMA_IMA = k;
    var s = document.querySelectorAll('#stage .slide');
    for (var i = 0; i < s.length; i++) {
      var el = s[i];
      if (el.dataset.yama === undefined) continue;
      var src = YAMA[k][parseInt(el.dataset.yama, 10)];
      var inner = '';
      if (src.kicker) inner += '<div class="kicker">' + src.kicker + '</div>';
      inner += '<h1>' + src.h + '</h1>';
      if (src.sub) inner += '<div class="sub">' + src.sub + '</div>';
      if (src.pts) { inner += '<ul class="pts">'; for (var j = 0; j < src.pts.length; j++) { inner += '<li>' + src.pts[j] + '</li>'; } inner += '</ul>'; }
      if (src.deta) inner += '<div class="deta">' + src.deta + '</div>';
      inner += '<div class="foot">稼げる農業の仕組み化 伴走プログラム</div>';
      el.innerHTML = inner;
      el.dataset.note = src.note || '';
      /* 差し替えた枚だけ 大きさを入れ直す（前の枚で縮めた指定が残らないように）
         ★枚そのものの上下の余白も戻す＝Codexの指摘（前の山で縮んだ余白だけ残っていた） */
      var ko = el.querySelectorAll('*');
      for (var m = 0; m < ko.length; m++) { ko[m].style.fontSize = ''; ko[m].style.marginTop = ''; ko[m].style.rowGap = ''; }
      el.style.paddingTop = ''; el.style.paddingBottom = '';
    }
    try { window.localStorage.setItem('soudan_yama', JSON.stringify({k:k, t:Date.now()})); } catch (e) {}
    if (window.TSUMERU) { setTimeout(window.TSUMERU, 30); }
    if (typeof show === 'function') { show(cur); }   /* 台本の表示も入れ替える */
  }

  /* --- 段の押しボタンを6つ作る --- */
  for (var d = 0; d <= 5; d++) {
    (function(n){
      var b = document.createElement('button');
      b.innerHTML = '<span class="b-n">現状 ' + n + '</span>' + DANNAME[n][0] +
                    '<span class="b-y">' + DANNAME[n][1] + '</span>';
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        yamaKirikae(DAN2YAMA[n]);
        pick.classList.add('hide');
      });
      row.appendChild(b);
    })(d);
  }

  /* --- 話しているうちにずれた時＝1・2・3 でその場で入れ替える（何も表示は出ない）--- */
  document.addEventListener('keydown', function(e){
    if (!pick.classList.contains('hide')) return;
    if (e.key === '1') { yamaKirikae('A'); }
    else if (e.key === '2') { yamaKirikae('B'); }
    else if (e.key === '3') { yamaKirikae('C'); }
  });

  /* --- 検品＝〔 〕の書き換え忘れが何個 残っているかを、選ぶ画面にだけ出す --- */
  function kenpin(){
    var box = document.getElementById('dp-kenpin');
    var honbun = 0, daihon = 0;
    var mita = {};                     /* ★同じ台本を2回 数えない＝2枚に割れた枚は台本が複製されるため
                                          （Codexの指摘・2026-09-01） */
    var s = document.querySelectorAll('#stage .slide');
    for (var i = 0; i < s.length; i++) {
      honbun += (s[i].textContent.match(/〔/g) || []).length;
      var nt = s[i].dataset.note || '';
      if (nt && !mita[nt]) { mita[nt] = 1; daihon += (nt.match(/〔/g) || []).length; }
    }
    var namae = /山崎|小谷|馬場|藤原|菊池|Aki|山田/.test(document.title) ? 1 : 0;
    if (honbun === 0 && daihon === 0 && namae === 0) {
      box.className = 'dp-kenpin ok';
      box.innerHTML = '✅ 書き換え忘れ 0か所。表題に人の名前も入っていません。このまま始められます。';
    } else {
      box.className = 'dp-kenpin ng';
      box.innerHTML = '⚠️ 書き換え忘れが残っています＝画面に出る文 <b>' + honbun + '</b>か所／口で話す台本 <b>' + daihon + '</b>か所' +
        (namae ? '／<b>表題に前の方の名前が残っています</b>' : '') +
        '<br>この〔 〕は そのまま相手の画面に出ます。始める前に全部 消してください。';
    }
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function(){ setTimeout(kenpin, 200); }); }
  setTimeout(kenpin, 1400);
})();
</script>
