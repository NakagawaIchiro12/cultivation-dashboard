<!DOCTYPE html>
<html lang="ja">
<head>

<title>農業相談会スライド（菊池隆昭さん）</title>
<style>
  :root{ --green:#2e7d32; --green-d:#1b5e20; --ink:#12200f; --paper:#f6f8f3; --gold:#b8892b; --line:#dfe6d8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#0e1410;color:var(--ink);overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{background:#0e1410;}
  .slide{display:none;width:1600px;height:900px;flex:0 0 auto;padding:81.0px 6%;flex-direction:column;justify-content:center;box-shadow:0 0 40px rgba(0,0,0,.5);
         position:relative;background-color:var(--paper);
         background-image:linear-gradient(100deg,
             rgba(246,248,243,.98) 0%, rgba(246,248,243,.96) 48%,
             rgba(246,248,243,.97) 74%, rgba(246,248,243,.94) 100%),
           url('bg-content.jpg');
         background-size:cover;background-position:center right;}
  .slide.active{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{color:var(--green-d);font-weight:800;font-size:40.5px;letter-spacing:.12em;margin-bottom:35.1px;}
  h1{font-size:113.4px;line-height:1.22;color:var(--green-d);font-weight:900;letter-spacing:.01em;}

  .sub{font-size:62.1px;line-height:1.55;margin-top:45.9px;color:#12200f;font-weight:600;max-width:40ch;}
  ul.pts{margin-top:48.6px;list-style:none;display:flex;flex-direction:column;gap:35.1px;}
  ul.pts li{font-size:64.8px;line-height:1.4;font-weight:700;padding-left:1.4em;position:relative;color:#12200f;}
  ul.pts li::before{content:"";position:absolute;left:0;top:.5em;width:.55em;height:.55em;border-radius:50%;background:var(--gold);}
  .quote{font-size:59.4px;line-height:1.6;color:#12200f;font-weight:600;max-width:38ch;margin-top:35.1px;
         border-left:10.8px solid var(--green);padding:13.5px 0 13.5px 48.0px;background:#fff;border-radius:0 12px 12px 0;
         box-shadow:0 6px 24px rgba(30,60,25,.08);padding-right:48.0px;padding-top:35.1px;padding-bottom:35.1px;}
  .who{margin-top:32.4px;font-size:45.9px;color:var(--gold);font-weight:800;}
  .big{font-size:135.0px;color:var(--green-d);font-weight:900;}
  .price{font-size:175.5px;color:var(--green-d);font-weight:900;letter-spacing:.02em;}
  /* 核心の悩み 見える化 */
  .worrycore{margin-top:29.7px;font-size:86.4px;line-height:1.25;color:var(--green-d);font-weight:900;
             background:#fff;border-left:13.5px solid var(--gold);border-radius:0 14px 14px 0;
             padding:32.4px 48.0px;box-shadow:0 8px 28px rgba(30,60,25,.10);max-width:34ch;}
  .worrycards{display:flex;gap:32.0px;margin-top:45.9px;flex-wrap:wrap;max-width:58ch;}
  .wcard{flex:1 1 0;min-width:297.0px;background:#fff;border:4.0px solid var(--line);border-radius:16px;
         padding:29.7px 25.6px;box-shadow:0 6px 20px rgba(30,60,25,.07);}
  .wcard.on{background:#eef6ea;border-color:var(--green);}
  .wc-h{font-size:40.5px;font-weight:800;color:var(--gold);letter-spacing:.04em;margin-bottom:16.2px;}
  .wcard.on .wc-h{color:var(--green-d);}
  .wc-b{font-size:48.6px;line-height:1.4;font-weight:700;color:#12200f;}
  .wc-b b{color:var(--green-d);}
  .cover{background-image:linear-gradient(100deg,
             rgba(247,250,244,.93) 0%, rgba(247,250,244,.88) 40%,
             rgba(247,250,244,.95) 72%, rgba(247,250,244,.90) 100%),
           url('bg-cover.jpg');
         background-size:cover;background-position:center right;color:var(--ink);
         border-top:16.2px solid var(--green-d);}
  .cover h1{color:var(--green-d);font-size:121.5px;text-shadow:none;}
  .cover .sub{color:#33422f;}
  .cover .kicker{color:var(--green);}
  .cover .tag{background:var(--green-d);color:#fff;box-shadow:0 6px 20px rgba(27,60,25,.22);}
  .tag{display:inline-block;background:#fff;color:var(--green-d);font-weight:800;border-radius:999px;
       padding:17.6px 48.0px;font-size:48.6px;margin-top:54.0px;}
  .foot{display:none;}
  #counter{position:fixed;right:38.4px;bottom:32.4px;font-size:40.5px;font-weight:700;color:#2e7d32;background:rgba(255,255,255,.85);
           padding:10.8px 28.8px;border-radius:999px;z-index:20;}
  /* presenter notes: hidden by default, toggle with N. Warn: do not toggle while screen-sharing. */
  #note{position:fixed;left:0;right:0;bottom:0;background:#12241a;color:#eafff0;padding:32.4px 128.0px;
        font-size:40.5px;line-height:1.6;display:none;z-index:30;border-top:6.8px solid var(--gold);max-height:594.0px;overflow:auto;}
  #note.show{display:block;}
  #note b{color:var(--gold);}
  #hint{display:none;}
  .warn{position:absolute;top:40.5px;right:128.0px;font-size:37.8px;color:#b8892b;font-weight:800;}

  /* ★スマホ版で足した分 */
  #stage{overflow:hidden;}
  .slide{overflow:hidden;}
  .slide.active{animation:none !important;}
  body{-webkit-text-size-adjust:100%;}
</style>
<!-- ▼ここから下は「前回の方の版で足した1枚」＝見本(前の回の方版)のCSSは1文字も変えていない -->
<style>
  .qbig{margin-top:2.6vh;font-size:8.6vh;line-height:1.25;color:var(--green-d);font-weight:900;letter-spacing:.02em;white-space:nowrap;}
  .qbig.xl{font-size:13vh;}
  .qbig .q{color:var(--gold);}

  .wcard{min-width:0;}
  .steps{display:flex;gap:1.6vw;align-items:flex-end;margin-top:3.6vh;width:76%;}

  .step .n{font-size:2.8vh;color:var(--gold);font-weight:800;letter-spacing:.06em;}
  .step .v{font-size:4.2vh;font-weight:900;color:var(--green-d);margin-top:1vh;line-height:1.3;}
  .step.s1{height:18vh;} .step.s2{height:25vh;} .step.s3{height:32vh;} .step.s4{height:39vh;background:#eef6ea;border-color:var(--green);}
  .note-in{margin-top:2.4vh;font-size:3.2vh;color:#4a5a46;font-weight:700;}
</style>

<style>
/* ★2026-08-18 足した分＝この4つの指定が 元の紙に1つも無く、

.step{flex:1 1 0;min-width:260.0px;background:#fff;border:4.0px solid var(--line);border-radius:16px;

.step .v{font-size:39.0px;line-height:1.3;font-weight:800;color:var(--green-d);}
.step.s4{background:#eef6ea;border-color:var(--green);}
.step.s4 .n{color:var(--green-d);}
.qbig{margin-top:37.8px;font-size:86.4px;font-weight:900;color:var(--green-d);line-height:1.32;}
.qbig.xl{font-size:94.0px;}
.qbig .q{display:inline-block;background:#fff;border:5.0px solid var(--gold);border-radius:18px;
         padding:6.0px 30.0px;color:var(--green-d);}
.note-in{margin-top:29.7px;font-size:43.0px;color:#42513e;font-weight:700;line-height:1.45;}
/* 出典＝小さく・でも読める大きさで（数字を出したら必ず出どころを同じ画面に置く） */
.deta{margin-top:14.0px;font-size:26.0px;color:#5a6856;font-weight:700;line-height:1.35;word-break:break-all;}
/* ★数字を並べる枚は【1枚に全部 載せる】＝順位や対比は 並べて見せないと意味が無い。
   元の紙は はみ出すと箇条書きを1行ずつ別の枚に割る作りで、
   「茶23.0億／まんさいかん18.1億／野菜16.2億…」が 1行ずつ4枚に散っていた（実測）。
   この枚だけ 字を落として 1枚に収める。他の枚の大きさは 1つも変えていない。 */
.detaslide h1{font-size:78.0px;line-height:1.2;}
.detaslide .sub{font-size:44.0px;margin-top:22.0px;line-height:1.45;max-width:46ch;}
.detaslide ul.pts{margin-top:24.0px;gap:14.0px;}
.detaslide ul.pts li{font-size:42.0px;line-height:1.28;}
.detaslide ul.pts li::before{top:.42em;width:.45em;height:.45em;}
.detaslide .kicker{margin-bottom:20.0px;}
</style>
<style>
.detaslide h1{font-size:68.0px;line-height:1.18;}
.detaslide .sub{font-size:40.0px;margin-top:20.0px;line-height:1.42;max-width:48ch;}
.detaslide ul.pts{margin-top:20.0px;gap:12.0px;}
.detaslide ul.pts li{font-size:38.0px;line-height:1.26;}
.detaslide .deta{margin-top:16.0px;font-size:22.0px;line-height:1.32;}
</style>
</head>
<body>

<script>

   ★この回に 地域の数字は1つも入れていない＝畑がどこか こちらで分かっていないため。
     よその方の地域の数字を そのまま当てはめる事は しない。
   ★こちらで足した本人の事実は0個。空欄は〔当日 記入〕のまま置く。 */
const S = [
/* ===== 菊池 隆昭さん（LINE表示名 Aki.K）／2026-08-20 20:00 ／「1. 生産の安定」 =====

 {cls:"cover", kicker:"農業相談会", h:"今日は、いま居る場所を<br>はっきりさせて帰る時間です", sub:"選んでくださったのは「生産の安定」。今日は、その中身を一緒に言葉にして、次にやる事を1つ決めて帰ります。",
  tag:"農業相談会", note:"菊池さん、本日はお時間ありがとうございます。今日は、いま菊池さんが居る場所をはっきりさせて、次にやる事を1つ決めて帰っていただく時間です。いきなり何かを売る場ではありません。前半はほとんど、僕が聞く時間にします。というのも、菊池さんの畑のことを、僕はまだ何も知らないんです。今日はそこから教えてください。"},

 {kicker:"はじめに", h:"今日のゴール", pts:["いま居る場所を、数字で置いてみる","「安定」の中身を、言葉にして共有する","次にやる事を、1つだけ決める"],
  note:"今日のゴールは3つです。1つ、いま居る場所を数字で置いてみる。2つ、安定の中身を言葉にして共有する。3つ、次にやる事を1つだけ決める。この3つが揃うと、帰ってから何をすればいいかが はっきりします。逆に、たくさん持って帰ろうとすると、どれも動きません。"},
 {kicker:"はじめに", h:"今日の進め方", sub:"前半は、僕がひたすら聞きます。1つずつ深く。そのあとで、僕の考え方をお伝えします。合わなければ無理に案内しません。",
  note:"進め方です。前半は僕がひたすら聞きます。1つずつ深く聞かせてください。そのあとで僕の考え方をお伝えします。合わないと感じられたら、無理に案内はしません。役に立てる時だけ提案します。"},

 {kicker:"はじめに", h:"先に、正直に言っておきます", sub:"申込のときの設問は1問だけでした。だから僕は、菊池さんの畑のことを まだ何も知りません。今日は、そこを埋めるところから始めます。",
  note:"先に正直に言っておきます。申込のときにお答えいただいた設問は1問だけで、菊池さんは『生産の安定』を選んでくださいました。それ以外は、こちらに情報がありません。畑の広さも、作っている物も、どこへ出しているかも、まだ知りません。ですので今日は、そこを埋めるところから始めます。答えづらい所は飛ばして大丈夫です。"},

 /* ===== 自己紹介 ===== */
 {kicker:"自己紹介", h:"中川一郎<br>農業歴16年・順番を決めて広げてきました", sub:"根性で量を出しているのではありません。順番を決めて、そのつど仕組みに変えて広げてきました。", pts:["1代目・親から継がずに始めた","いまは1日実働 約5時間","年間100t超（2026年は200tも視野）","繁忙期は、学びに来る方も受け入れる側"],
  note:"本題の前に少しだけ自己紹介を。農業歴16年です。親から継いでいません。1代目で、何も持っていない所から始めました。今は1日実働 約5時間で、年間100t超。2026年は200tも視野に入っています。根性で量を出しているのではなくて、順番を決めて、そのつど仕組みに変えてきた結果です。今日お話しするのは、その順番の話です。"},

 /* ===== 前半＝聞く（ここで20分。この回はここが主役）===== */
 {kicker:"確認させてください", h:"選んでくださったのは、これでした", sub:"※申込フォームでお答えいただいた言葉、そのままです",
  quote:"1. 生産の安定",
  note:"最初に、これを読ませてください。申込のときに選んでくださった答えです。『1. 生産の安定』。——この選び方をされる方は、もう作り始めている方です。これから始める方は、だいたい別の答えを選びます。なので、まずそこを確かめさせてください。菊池さんは今、もう作っておられますよね。"},

 {kicker:"確認させてください", h:"「安定」を選んだのは、<br>どの場面で そう思われましたか", sub:"同じ「安定」でも、量が読めない・値が読めない・時間が読めない、で打つ手が変わります。",
  note:"『生産の安定』を選ばれたとき、どの場面が頭にありましたか。——ここ、大事なんです。同じ『安定』でも、中身は3つくらいに分かれます。量が読めない。値が読めない。時間が読めない。どれかで、打つ手が全然 変わります。菊池さんの場合は、どれが近いですか。※答えを誘導しない。本人の言葉が出るまで待つ。"},

 {kicker:"今日いちばん聞きたいこと", h:"いま居る場所を、6つだけ<br>聞かせてください", sub:"これが揃うと、次にやる事が自動的に決まります。答えづらい所は飛ばして大丈夫です。",
  diagram:`<div class="worrycards">
    <div class="wcard"><div class="wc-h">① 広さ</div><div class="wc-b"><b>畑は何アール</b><br>使えているのは</div></div>
    <div class="wcard"><div class="wc-h">② 品目</div><div class="wc-b"><b>いま何を<br>いくつ</b>作っているか</div></div>

 {kicker:"今日いちばん聞きたいこと", h:"残りの3つも、<br>聞かせてください",
  diagram:`<div class="worrycards">
    <div class="wcard"><div class="wc-h">④ 時間</div><div class="wc-b">1日 <b>何時間</b><br>畑に入れるか</div></div>
    <div class="wcard"><div class="wc-h">⑤ お金</div><div class="wc-b">畑に使えるのは<br><b>月いくら</b>か</div></div>

  note:"後半の3つです。④時間。1日、何時間くらい畑に入れていますか。お勤めをされているかどうかでも変わります。⑤お金。畑に使えるお金は、月にどのくらいですか。⑥目標。農業で年間いくら稼ぎたいですか。——⑤と⑥は答えづらいと思うので、ざっくりで大丈夫です。桁だけでも構いません。〔当日 記入〕推測で埋めない。"},

 {kicker:"深掘り ①", h:"その中で、いちばん<br>手が止まるのはどこですか", sub:"手が止まる場面が分かると、直す所と、直さなくていい所が分かれます。",

 {kicker:"深掘り ②", h:"去年、いちばん<br>うまくいかなかったのは何ですか", sub:"うまくいかなかった物の中に、いちばん大きい改善が眠っています。",

 {kicker:"深掘り ③", h:"逆に、いちばん<br>手応えがあったのは何ですか", sub:"手応えのあった物は、次の主役の候補です。",

 {kicker:"確認させてください", h:"1年後、どうなっていたら<br>「安定した」と言えますか", sub:"ここが決まらないと、何をやっても「まだ足りない」になります。",
  note:"最後にもう1つ。1年後、どうなっていたら『安定した』と言えますか。——ここ、意外と決めていない方が多いんです。決まっていないと、何をやっても『まだ足りない』になってしまう。数字でも、状態でも構いません。菊池さんの言葉で言ってみてください。〔当日 記入〕"},

 {kicker:"ポイント", h:"ここまで聞かせていただいた分、<br>順番を決めれば外せます", sub:"新しい道具を足す話ではありません。いま持っているものを、どの順で触るかの話です。",
  note:"ありがとうございます。ここまで聞かせていただいた分で、だいたい見えました。この先は、僕の考え方をお話しします。先に言っておくと、新しい道具を買う話ではありません。いま持っているものを、どの順で触るかの話です。聞いてみますか。"},

 /* ===== 考え方 ===== */
 {kicker:"考え方", h:"悩みは、3つのどれかに<br>仕分けるところから", pts:["安定 … 読める量が作れているか","売り先 … 誰に・なぜ選ばれ・続くか","拡大 … 面積・人・設備"],
  note:"農業の悩みは、突き詰めると3つのどれかに入ります。安定、売り先、拡大。安定は、読める量が作れているか。売り先は、誰に・なぜ選ばれて・それが続くか。拡大は、面積・人・設備です。この3つは順番が決まっていて、飛ばすと必ず戻されます。菊池さんは『安定』を選ばれた。これは いちばん最初の場所で、正しい選び方です。"},

 {kicker:"考え方", h:"行きたい場所ではなく、<br>いま居る場所を見る", sub:"目標も、選んだ番号も「行きたい場所」。決め手になるのは、いま居る場所です。そして現在地は、自分が一番見えません。",
  note:"ここで1つ、大事な話を。目標も、選んでいただいた番号も、実は『行きたい場所』なんです。決め手になるのは、いま居る場所の方です。そして現在地って、自分が一番見えないんですよ。毎日そこに居るので。だから今日、前半であれだけ聞かせていただきました。外から見てもらうのが、いちばん早いんです。"},

 {kicker:"ここを考えたいです", h:"「安定」って、<br>何と何でできていますか",
  diagram:`<div class="qbig xl">安定 ＝ <span class="q">？</span> ＋ <span class="q">？</span></div>`,
  notein:"菊池さんなら、この2つに何を入れますか。",
  note:"では、ここを一緒に考えたいです。『安定』って、何と何でできていると思いますか。——菊池さんなら、この2つに何を入れますか。少し考えてみてください。※必ず本人に答えてもらう。すぐ答えを出さない。沈黙は待つ。"},

 {kicker:"僕の答えです", h:"僕は、この2つで<br>できていると思っています",
  diagram:`<div class="qbig">安定 ＝ <span class="q">反収向上</span> ＋ <span class="q">反収の安定</span></div>`,
  notein:"面積を増やすことも、道具を増やすことも、安定そのものではありません。",
  note:"僕の答えです。安定は、反収向上と、反収の安定、この2つでできています。反収というのは、10アールあたりどれだけ採れるか。それを上げることと、毎年ブレなくすること。この2つです。——面積を増やすことも、道具を増やすことも、安定そのものではありません。ここが逆になっている方が、本当に多いんです。"},

 {kicker:"ここが山です", h:"「もっと作れば安定する」<br>——順番が逆です", sub:"品目を足したり、面積を広げたりする前に、いま在る畑で読める量を作る。そこから、必要な物がはっきりします。",
  note:"ここが今日の山です。『もっと作れば安定する』——これ、順番が逆なんです。品目を足したり、面積を広げたりする前に、まず いま在る畑で読める量を作る。読めるようになると、次に何が足りないかが自分で分かります。道具も、面積も、その後で決まります。先に増やすと、増えた分だけ ブレも増えます。"},

 {kicker:"考え方", h:"品目が多いほど、<br>反収は読めなくなります", sub:"1つ1つに手を掛ける時間が割れて、どれも「去年どうだったか」が残りません。",
  note:"もう1つ。品目が多いほど、反収は読めなくなります。1つ1つに手を掛ける時間が割れて、どれも中途半端になる。そして何より、どれも『去年どうだったか』が残らないんです。記録が残らないと、次に活かせない。菊池さんは今、いくつ作っておられましたか。——そこが多いようでしたら、そこが最初の手です。"},

 {kicker:"ここが いちばん厳しい所", h:"収益の上がらない作物に<br>分散していること自体が、厳しい", sub:"そのままでは、伸びません。ここは正直に置かせてください。",
  note:"ここは正直に置かせてください。作れない作物、収益の上がらない作物を たくさん出そうとして分散していること自体が、まず かなり厳しいんです。そのままでは、全然 伸びません。——菊池さんがそうだと言っているわけではありません。ただ、安定が課題の方の8割は、ここに引っかかっています。あとで一緒に確かめさせてください。"},

 {kicker:"考え方", h:"横ばいは、現状維持ではなく<br>下がっています", sub:"だから「何を足すか」より、「今年やらないことを何にするか」の方が効きます。",
  note:"それと、これも言っておきます。横ばいは、現状維持ではありません。資材も燃料も上がっているので、同じ事をしていたら 実質は下がっています。だから『何を足すか』より、『今年やらないことを何にするか』の方が効くんです。やらない事を決めるのは、勇気が要りますけどね。"},

 /* ===== 実績 ===== */
 {kicker:"実績", h:"1日実働 約5時間。<br>長く働いた結果ではありません", sub:"朝9時から14時。順番を決めて、そのつど仕組みに変えてきた結果です。",
  note:"僕の話を少しだけ。今、1日の実働は約5時間です。朝9時から14時くらい。長く働いた結果ではありません。順番を決めて、そのつど仕組みに変えてきた結果です。最初からこうだったわけではなくて、昔は朝から晩まで畑に居ました。"},
 {kicker:"実績", h:"年間100t超。<br>2026年は200tも視野に", sub:"最初から100tだったわけではありません。読める量を作るところから始めています。",
  note:"出荷量は年間100t超で、2026年は200tも視野に入っています。ただ、最初から100tだったわけではありません。読める量を作るところから始めて、読めるようになってから広げました。順番はこれだけです。"},
 {kicker:"実績", h:"大不作の年でも、<br>3日で1ヶ月分を回収", sub:"2024年、全国的な大不作の年。多くの生産者が出せない中で、3日間で1ヶ月分の売上を回収しました。運ではありません。",
  note:"2024年、全国的な大不作の年がありました。多くの生産者が出せない中で、僕は3日間で1ヶ月分の売上を回収しました。これは運ではありません。読める量が作れていたから、出せる側に回れたんです。安定というのは、こういう時に効いてきます。"},
 {kicker:"実績", h:"産地化と、3年連続の表彰", sub:"愛知で初めて有機JASのニンジンを産地化。別の作物で3年連続の表彰。発芽率は70%から95%以上へ。",
  note:"それと、愛知で初めて有機JASのニンジンを産地化しました。別の作物で3年連続の表彰もいただいています。発芽率も70%から95%以上に上げました。——この発芽率の話が、まさに反収の安定です。同じ種を撒いても、揃うかどうかで量が変わる。"},

 {kicker:"僕の話", h:"僕も、順番を間違えて<br>10年 遠回りしました", sub:"売り先を先に作ろうとして、納品2週間前に量が半分。取引先に電話するのに手が震えました。",
  note:"正直に言うと、僕も順番を間違えて10年 遠回りしました。売り先を先に作ろうとしたんです。契約は取れました。でも納品2週間前に、量が半分しかなかった。取引先に電話するのに、手が震えました。——安定が先だと痛い目で分かったのが、その時です。だから菊池さんには、同じ回り道をしてほしくないんです。"},

 /* ===== 目標までのやる順番 ===== */
 {cls:"detaslide", kicker:"目標の話", h:"全国の農家の 83.9%が、<br>販売金額 1,000万円未満です", sub:"だから、まず そこを抜ける順番を作る。ここは根性の話ではありません。",
  pts:["全国の農業経営体＝799,700","そのうち 販売金額1,000万円未満＝671,100（83.9%）","1,000万円以上は 128,600（16.1%）だけ"],
  diagram:`<div class="deta">出典＝農林水産省「令和8年 農業構造動態調査結果（令和8年2月1日現在）」2026年6月30日 公表<br>統計表1(7)「農産物販売金額規模別経営体数」より算出（83.9%＝671,100÷799,700）<br>https://www.maff.go.jp/j/tokei/kouhyou/noukou/index.html</div>`,
  note:"目標の話に入る前に、1つだけ数字を置かせてください。全国の農業経営体は 799,700。そのうち販売金額が1,000万円未満なのが 671,100で、83.9%です。1,000万円以上は16.1%しか居ません。——これ、菊池さんが特別だという話ではないんです。逆で、みんなここで止まっている。根性が足りないからではなくて、順番を作っていないからです。だから今日、順番の話をしています。※83.9%は公表資料に書いてある数字ではなく、公表されている統計表の実数から こちらで割り算した数字。そう言い添える。"},

 {kicker:"目標の話", h:"目標の金額。<br>まず、いまいくらですか", sub:"目標だけがあると、遠すぎて動けません。現在地の数字を一度、口に出して置いてみてください。",
  note:"【必ず本人に数字を言ってもらう】さきほど、農業でいくら稼ぎたいかを聞かせていただきました。いい目標です。ただ、目標だけがあると遠すぎて動けないんですよ。なので一度、現在地を教えてください。今、月にどのくらいになっていますか。——数字が出たら否定も評価もしない。『分かりました、ではそこからのやる順番を作りましょう』と受ける。数字を言いたくない様子なら『ざっくりで大丈夫です、桁だけでも』と言い換える。〔当日 記入〕この数字は こちらの記録には無い。推測で埋めない。"},
 {kicker:"目標の話", h:"目標には、<br>一度には届きません",
  diagram:`<div class="steps">
    <div class="step s1"><div class="n">いま</div><div class="v">〔当日<br>記入〕</div></div>
    <div class="step s2"><div class="n">1つ目</div><div class="v">？</div></div>
    <div class="step s3"><div class="n">2つ目</div><div class="v">？</div></div>
    <div class="step s4"><div class="n">その先</div><div class="v">目標</div></div>
  </div>`,
  note:"目標には、一度には届きません。順番に分ける必要があります。いま ここ、次はここ、その次はここ、そして目標。この順番を、今日 一緒に引きます。大事なのは、次にやる事をいくらに置くかです。いきなり目標を見ずに、次にやる事だけを見る。※空欄は当日 本人の数字で埋める。こちらから金額を提案しない（うちの記録に菊池さんの数字は無い）。"},

 {kicker:"やる順番", h:"1つ目にやる事は「1品目の反収を上げる」。<br>では、その1品目をどう決めるか", sub:"ここが、今日いちばんお伝えしたい所です。1品目は、当てずっぽうでは決まりません。",
  diagram:`<div class="steps">
    <div class="step s1"><div class="n">①</div><div class="v">売上の<br>データを取る</div></div>
    <div class="step s2"><div class="n">②</div><div class="v">いまと違う<br>出荷先を見つける</div></div>
    <div class="step s3"><div class="n">③</div><div class="v">出荷先が決まると<br>作る1品目が決まる</div></div>
    <div class="step s4"><div class="n">④</div><div class="v">その1品目の<br>反収を上げる</div></div>
  </div>`,
  note:"1つ目にやる事は、1品目の反収を上げること。ここは変わりません。ただ、今日いちばんお伝えしたいのは、その1品目を いかに決めるか、なんです。順番はこの4つです。①まず、売上のデータを取る。②いまと違う出荷先を見つける。③出荷先が決まると、作る1品目が決まる。④その1品目の反収を上げる。——④だけ先にやろうとすると、どの品目に賭けるかが勘になります。①から順に行きます。1枚ずつ見ていきましょう。"},

 {cls:"detaslide", kicker:"① データを取る", h:"まず、売上の<br>データを取ります", sub:"何が・いくらで・いつ売れたか。この3つだけ。ここが無いと、あとの話が全部 勘になります。",
  pts:["何が売れたか（品目）","いくらで売れたか（単価と金額）","いつ売れたか（曜日・時期）"],
  note:"①です。まず、売上のデータを取ってください。これは僕が持っていない数字で、菊池さんにしか出せません。何が・いくらで・いつ売れたか。この3つだけでいいです。直売所の精算書でも、伝票でも、手書きのノートでも構いません。——これ、今日の帰りからできます。ここが無いまま『何を作ろうか』を考えると、全部 勘になるんです。次の面談までに、この3つを持ってきていただけますか。※本人に出してもらう数字。こちらで作らない。"},

 {kicker:"② 出荷先を見つける", h:"次に、いまと違う<br>出荷先を見つけます", sub:"いまの出し先を続けるのは、全然いいんです。ただ、それだけで先が見えるかどうか。",
  note:"②です。次に、いまと違う出荷先を見つけます。——先に言っておくと、いまの出し先をやめる話ではありません。続けるのは全然いいんです。ただ、それだけで先が見えるかどうか、なんです。1本しか無いと、そこの都合で全部が決まってしまう。2本目があると、こちらが選べるようになります。"},

 {kicker:"② の材料", h:"ここで、本当は<br>地域の数字をお見せしたいのですが", sub:"菊池さんの畑がどこに在るか、こちらでは分かっていません。住所の欄が空のままでした。",
  note:"ここで本当は、菊池さんの地域の数字をお見せしたい所です。その市で何がいくら売れているか、地元の農協が何を扱っているか。——ただ、正直に言います。菊池さんの畑がどこに在るか、こちらでは分かっていません。お申込みのときの住所の欄が、空のままなんです。よその方の地域の数字を そのまま当てはめるのは、いちばんやってはいけない事だと思っているので、今日は入れていません。まず、どちらでやっておられるか教えていただけますか。"},

 {kicker:"② の材料", h:"地域を教えていただければ、<br>その場でお調べします", sub:"市の農業産出額・地元の農協が扱っている品目・その地域の主な農産物。この3つは、公表されている数字です。",
  note:"地域さえ教えていただければ、この3つは公表されている数字なので、その場でお調べできます。1つ、その市の農業産出額。何がいちばん大きいか。2つ、地元の農協が何をいくら扱っているか。3つ、その地域の主な農産物は何か。——この3つが分かると、『何を作ろうか』が当てずっぽうでなくなります。買ってくれる所がある物から決められるようになる。次の面談までにお調べして、お持ちします。"},

 {cls:"detaslide", kicker:"② の材料", h:"地域が分からなくても、<br>受け皿の型は4つです", sub:"直売所以外の受け皿は、どの地域にも だいたいこの4つが在ります。",
  pts:["学校給食（市町村の給食センター）","加工（農産加工・業務用）","ふるさと納税（返礼品）","産直EC（ネットで直接 売る）"],
  note:"地域が分からなくても、これはお伝えできます。直売所以外の受け皿は、どの地域にも だいたい この4つが在ります。1つ、学校給食。市町村の給食センターです。2つ、加工。業務用に回す道です。3つ、ふるさと納税の返礼品。4つ、産直EC。ネットで直接 売る道です。——この4つのどれが菊池さんの地域に在るか、次の面談までに一緒に確かめましょう。この4つが全国でどれだけ動いているか、次の枚から順に見せます。"},

 {cls:"detaslide", kicker:"② の材料｜全国の数字", h:"直売所の外側に、<br>もう1兆円分の受け皿があります", sub:"農業生産関連事業（直売所・加工・農家レストラン・観光農園）の全国の売上です。",
  pts:["農産物直売所 1兆1,344億円（全体の51.0%）","農産加工 1兆61億円（45.2%）","農家レストラン 399億円／観光農園 391億円","合計 2兆2,244億円（令和6年度）"],
  diagram:`<div class="deta">出典＝農林水産省「令和6年度 6次産業化総合調査結果」（第1報 2026年3月31日公表・確報 2026年7月7日公開）<br>https://www.maff.go.jp/j/tokei/kouhyou/rokujika/index.html</div>`,
  note:"まず、受け皿の大きさです。直売所は全国で 1兆1,344億円 動いています。ただ、その隣に農産加工が 1兆61億円 在るんです。ほぼ同じ大きさです。合わせて 2兆2,244億円。——ここで言いたいのは、直売所の外側に もう1兆円分の受け皿が在る、ということです。同じ物を作っていても、出す先を1つ足すだけで、値の決まり方が変わります。令和6年度の数字で、農林水産省の6次産業化総合調査です。"},

 {cls:"detaslide", kicker:"② の材料｜全国の数字", h:"学校給食は、地元の物を<br>増やそうとしています", sub:"国が 目標を立てて 増やしにいっている所です。だから、こちらから聞きに行く価値があります。",
  pts:["学校給食の地場産物の使用割合＝全国平均 57.2%（令和7年度・金額ベース）","国産食材＝90.0%","国の方針＝令和7年度の割合から 維持・向上した都道府県を 90%以上にする"],
  diagram:`<div class="deta">出典＝文部科学省「令和7年度 学校給食における地場産物・国産食材の使用状況調査」<br>https://www.mext.go.jp/b_menu/toukei/chousa05/eiyou/gaiyou/1406811_00009.html<br>／農林水産省「第5次食育推進基本計画」（2026年6月24日 決定）https://www.maff.go.jp/j/syokuiku/kannrennhou.html</div>`,
  note:"次に学校給食です。全国の平均で、地場産物の使用割合が57.2%、国産食材が90.0%。令和7年度の金額ベースです。——大事なのは、国がこれを増やしにいっている、という所です。第5次の食育推進基本計画で、令和7年度の割合から維持・向上した都道府県を90%以上にする、と決めています。つまり、給食センターの側も 地元の生産者を探しているんです。こちらから聞きに行く価値があります。"},

 {cls:"detaslide", kicker:"② の材料｜全国の数字", h:"ふるさと納税と、<br>ネットで直接 売る道", sub:"どちらも、地元の農協や直売所を通さずに 値をこちらで決められる道です。",

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.cls?(' '+s.cls):'');
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  inner+=`<h1>${s.h}</h1>`;
  if(s.sub) inner+=`<div class="sub">${s.sub}</div>`;
  if(s.quote) inner+=`<div class="quote">「${s.quote}」</div>`+(s.subq?'':'');
  if(s.sub&&s.quote){}
  if(s.pts){inner+='<ul class="pts">'+s.pts.map(p=>`<li>${p}</li>`).join('')+'</ul>';}
  if(s.diagram) inner+=s.diagram;
  if(s.tag) inner+=`<div class="tag">${s.tag}</div>`;
  if(s.who) inner+=`<div class="who">${s.who}</div>`;
  inner+=`<div class="foot">稼げる農業の仕組み化 伴走プログラム</div>`;
  d.innerHTML=inner;
  d.dataset.note=s.note||'';
  stage.appendChild(d);
});

/* ★入り切らない枚を【縮めずに 2枚へ割る】（ご主人様2026-08-17「細かい文字はだめ」）
   割る所＝箇条書きの最後の1行から。割った先の見出しは「（つづき）」を付ける。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display='flex';
    var ng = el.scrollHeight > el.clientHeight + 2;
    el.style.display = m;
    return ng;
  }
  var stage = document.getElementById('stage');
  var mawaru = 0;
  while (mawaru < 40) {
    var s = stage.querySelectorAll('.slide');
    var watta = false;
    for (var i = 0; i < s.length; i++) {
      var el = s[i];
      if (!afureteru(el)) continue;
      var ul = el.querySelector('ul.pts');
      if (!ul || ul.children.length < 2) continue;      /* 割れない枚は そのまま */
      var atarashii = el.cloneNode(true);
      /* ★ご主人様2026-08-17 18:08「中川一郎なんとか、中川一郎なんとかって【連呼】されている。
         タイトルは1回で良い。その後は中身を伝えていけばいい」
         ＝割った先で 大きい見出しを もう一度 出すのをやめる。
         　小さい行（kicker）に「◯◯（つづき）」と置くだけにする。 */
      /* ★ご主人様2026-08-17 18:15（本人の文字・そのまま）
         「**(つづき)いらない／全てつづき**」「**全て続きだから そんな表記はいらない。要らぬお世話**」
         ＝割った先の枚では **見出しも（つづき）の表記も 出さない**。中身だけ続ける。 */
      var h = atarashii.querySelector('h1,h2');
      if (h) { h.remove(); }
      /* 新しい方＝最後の1行だけ残す／元の方＝最後の1行を落とす */
      var nul = atarashii.querySelector('ul.pts');
      while (nul.children.length > 1) { nul.removeChild(nul.firstElementChild); }
      var sub = atarashii.querySelector('.sub'); if (sub) { sub.remove(); }
      var q = atarashii.querySelector('.quote'); if (q) { q.remove(); }
      ul.removeChild(ul.lastElementChild);
      atarashii.classList.remove('active');
      el.parentNode.insertBefore(atarashii, el.nextSibling);
      watta = true;
      break;
    }
    if (!watta) break;
    mawaru++;
  }

  /* ★割れない枚（表紙・カード・大きい数字など）だけ、最後の方法で文字を落とす。
     ただし【元の大きさより小さくはしない】＝BAI 倍ぶんの余地の中だけで詰める。 */
  var s2 = stage.querySelectorAll('.slide');
  for (var k = 0; k < s2.length; k++) {
    var el2 = s2[k];
    var kai = 0;
    var nokori = 1 / 1.500;               /* ここまでしか小さくしない（＝元の大きさ） */
    var ima = 1.0;
    while (afureteru(el2) && kai < 12 && ima > nokori + 0.001) {
      var m2 = el2.style.display; el2.style.display = 'flex';
      var r = Math.max(0.94, el2.clientHeight / el2.scrollHeight);
      if (ima * r < nokori) { r = nokori / ima; }
      var ko = el2.querySelectorAll('*');
      for (var j = 0; j < ko.length; j++) {
        var cs = window.getComputedStyle(ko[j]);
        var f = parseFloat(cs.fontSize);
        if (f > 0) { ko[j].style.fontSize = (f * r) + 'px'; }
        var mt = parseFloat(cs.marginTop);
        if (mt > 0) { ko[j].style.marginTop = (mt * r) + 'px'; }
        var g = parseFloat(cs.rowGap);
        if (g > 0) { ko[j].style.rowGap = (g * r) + 'px'; }
      }
      var sp = parseFloat(window.getComputedStyle(el2).paddingTop);
      if (sp > 8) { el2.style.paddingTop = (sp * r) + 'px'; el2.style.paddingBottom = (sp * r) + 'px'; }
      el2.style.display = m2;
      ima = ima * r;
      kai++;
    }
  }
})();
let cur=0;const slides=[...document.querySelectorAll('.slide')];
const counter=document.getElementById('counter');
const noteBox=document.getElementById('note');let noteOn=false;
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  counter.textContent=(cur+1)+' / '+slides.length;
  if(noteOn){noteBox.innerHTML='<b>🎙 トーク台本（発表者のみ）：</b> '+(slides[cur].dataset.note||'—');}
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);}
  else if(e.key.toLowerCase()==='n'){noteOn=!noteOn;noteBox.classList.toggle('show',noteOn);show(cur);}
  else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
});
stage.addEventListener('click',()=>show(cur+1));
const _h=parseInt((location.hash||'').slice(1),10);
show(isNaN(_h)?0:_h);
</script>

<script>
// ★箱ごと 画面に収まるだけ拡大／縮小する
// ★zoom を使う：transform は .slide.active の fade の keyframe が
//   transform:none で上書きするので 効かなかった（実測して分かった）
(function(){
  function fit(){
    var k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    var s = document.querySelectorAll('.slide');
    for (var i = 0; i < s.length; i++) { s[i].style.zoom = k; }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  document.addEventListener('keydown', function(){ setTimeout(fit, 10); });
  document.addEventListener('click', function(){ setTimeout(fit, 10); });
  window.addEventListener('load', fit);
  setTimeout(fit, 30);
  setInterval(fit, 800);
})();
</script>

<script>
/* ★はみ出しの【最後の1回】＝字が全部そろってから もう一度 見る。
   元の紙の縮め方は 読み込みの途中で1回だけ走る＝字が後から届くと 3〜6px はみ出したまま残る。
   （実測＝92枚中5枚が 3〜6px はみ出していた）。ここでは 残った分だけ 0.98倍ずつ詰める。
   ★見本のCSSも 元の script も さわっていない。後ろに足しただけ。 */
(function(){
  function afureteru(el){
    var m = el.style.display; el.style.display = 'flex';
    var ng = el.scrollHeight > el.clientHeight + 1;
    el.style.display = m;
    return ng;
  }
  function tsumeru(){
    var s = document.querySelectorAll('.slide');
    for (var i = 0; i < s.length; i++) {
      var el = s[i], kai = 0;
      while (afureteru(el) && kai < 25) {
        var m = el.style.display; el.style.display = 'flex';
        var ko = el.querySelectorAll('*');
        for (var j = 0; j < ko.length; j++) {
          var cs = window.getComputedStyle(ko[j]);
          var f = parseFloat(cs.fontSize);
          if (f > 0) { ko[j].style.fontSize = (f * 0.98) + 'px'; }
          var mt = parseFloat(cs.marginTop);
          if (mt > 0) { ko[j].style.marginTop = (mt * 0.98) + 'px'; }
          var g = parseFloat(cs.rowGap);
          if (g > 0) { ko[j].style.rowGap = (g * 0.98) + 'px'; }
        }
        el.style.display = m;
        kai++;
      }
    }
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function(){ setTimeout(tsumeru, 60); }); }
  window.addEventListener('load', function(){ setTimeout(tsumeru, 300); });
  setTimeout(tsumeru, 1200);
})();
</script>
