.kicker{font-size:40px;line-height:1.2;letter-spacing:.1em;color:var(--green2);font-weight:800;margin-bottom:34px}
h1{font-size:92px;line-height:1.23;color:var(--green);font-weight:900;letter-spacing:.01em;max-width:14ch}
.wide h1{max-width:18ch}
.slide:nth-child(1) h1{font-size:78px;max-width:20ch}

.sub{font-size:54px;line-height:1.48;font-weight:650;max-width:36ch;margin-top:42px}
.quote{font-size:66px;line-height:1.45;font-weight:850;color:var(--green);background:#fff;border-left:13px solid var(--gold);padding:32px 44px;margin-top:38px;max-width:31ch;box-shadow:0 8px 28px rgba(30,60,25,.10)}
.choices{display:flex;gap:32px;margin-top:48px;width:100%}
.choice{flex:1;background:#fff;border:4px solid var(--line);border-radius:18px;padding:32px 38px}
.choice strong{display:block;font-size:38px;color:var(--gold);margin-bottom:14px}
.choice span{display:block;font-size:52px;line-height:1.35;font-weight:850;color:var(--green)}
.steps{display:flex;align-items:center;gap:26px;margin-top:58px;width:100%}
.step{flex:1;text-align:center;background:#fff;border:4px solid var(--line);border-radius:18px;padding:32px 18px;font-size:50px;line-height:1.25;font-weight:900;color:var(--green)}
.arrow{font-size:58px;color:var(--gold);font-weight:900}
.promise{font-size:76px;line-height:1.35;font-weight:900;color:var(--green);margin-top:40px;max-width:28ch}
.small{font-size:43px;line-height:1.5;font-weight:650;margin-top:34px;max-width:42ch}
.tag{display:inline-block;width:max-content;background:var(--green);color:white;border-radius:999px;padding:16px 42px;font-size:40px;font-weight:800;margin-top:46px}
#note{display:none}

#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5;opacity:0;transition:opacity .18s}
body.controls-visible #controls,#controls:focus-within{opacity:1}
#controls button{border:1px solid #ffffff50;border-radius:8px;background:#172219ed;color:#fff;font:600 16px Meiryo,sans-serif;padding:10px 16px;cursor:pointer}
#controls button:disabled{opacity:.35;cursor:default}
@media print{html,body{height:auto;overflow:visible;background:white}.slide{display:flex!important;zoom:1!important;break-after:page;page-break-after:always}#stage{position:static;display:block}#controls{display:none!important}@page{size:1600px 900px;margin:0}}

h1,.sub,.quote,.step,.choice span{word-break:auto-phrase;text-wrap:balance}
h1{max-width:15em}.wide h1,.slide:nth-child(1) h1{max-width:17em}
.sub{max-width:26em}
.compact h1{font-size:74px;line-height:1.2;max-width:19em}
.compact .kicker{margin-bottom:24px}
.tbl{border-collapse:collapse;margin-top:36px;width:100%;background:#fff;box-shadow:0 8px 28px rgba(30,60,25,.10);font-size:42px}
.tbl th{background:var(--green);color:#fff;font-weight:850;padding:14px 26px;text-align:left}
.tbl td{border-top:3px solid var(--line);padding:12px 26px;font-weight:750;line-height:1.3}
.tbl td:first-child{color:var(--green)}
.src{font-size:28px;color:#556052;margin-top:18px;font-weight:600}
.bigq{font-size:120px;font-weight:900;color:var(--gold);margin-top:40px;letter-spacing:.04em}

<script>
const S=[{"cls":"cover wide","k":"農業相談会","h":"体に負担の少ないやり方で、品目を決める30分","sub":"畑20アール・1日4時間で、年150万円へ。","tag":"内藤 喜代志さん","note":"【話す】内藤さん、今日はありがとうございます。整理シート、読みました。ここから順番に聞かせていただきます。\n【確認】画面と声、大丈夫ですか。\n【聞く】お名前、「きよし」さんとお読みして合っていますか。（LINEの表示名は「NAITO」。読みは予約にも入っていない＝ここで確かめる）\n（整理シートを出した直後に「予約はこちら・3日以内に」の自動の案内が届いています。予約は10/1 20:00で入っているので、気にされていたら「予約はちゃんと入っています」と一言）"},{"k":"お話しする人","h":"100t農家のイチロウです","sub":"中川一郎｜畑仕事は1日5時間","note":"【話す】自然農と有機JAS、慣行農法を一通り経験して出荷してきました。今は実働1日5時間で、年間100tを超えるところまで来ています。スタッフの技術も、今は僕より伸びている所があります。今日は僕の話をするわけではなくて、内藤さんの条件に合わせて考えるために、立場だけお伝えしました。"},{"k":"今日の進め方","h":"先に状況をお聞きして、そのあとで考え方をお渡しします","sub":"良さそうなら使ってください。違えば感想に。","note":"【話す】先に状況をお聞きして、その後で僕の考え方をお渡しします。良さそうだなと思えば使っていただければ大丈夫ですし、ちょっと違うなと思えば、後の感想フォームで書いていただくこともできます。\n【聞く】この進め方で大丈夫ですか。"},{"k":"イチロウとのこれまで","h":"どの動画を見て、相談しようと思いましたか","sub":"知ったきっかけ／覚えている動画や言葉","note":"【聞く】YouTubeからご覧になって、お知りになったんですか。知ったきっかけとか、いつ頃から見てるかとか、教えていただければと思います。\n【聞く】「農業のゲームチェンジ」の動画は見ていただけましたか。覚えている言葉があれば教えてください。\n（1対1トークに内藤さんから届いた言葉は2件＝9/21 18:08「はじめまして、兼業農家です。前年の売り上げは、160万円の規模です。よろしくお願い致します」／9/28 08:24「よろしくお願いします。」）"},{"cls":"compact","k":"整理シートの言葉","h":"書いてくださった言葉から、始めます","quote":"「栽培品目が定まってないのが、問題です。」","sub":"「栽培品目の選択とやり方」","note":"【話す】シートの言葉、そのまま読ませてください。「栽培品目が定まってないのが、問題です。」そして今日知りたいことが「栽培品目の選択とやり方」。\n【聞く】品目の選び方と、作るやり方。今日はどちらを先に聞きたいですか。"},{"k":"今の条件","h":"畑20アールで、季節の野菜20品目","sub":"一宮市・ご家族と・1日4時間。稲作40アールは自家用。","note":"【聞く】畑20アールは、一宮市のどのあたりですか。何か所に分かれていますか。\n【聞く】ご家族と、と書いてくださいました。どなたが、どの作業に入っていますか。\n【聞く】1日4時間は、畑の作業と出荷を合わせた時間ですか。\n【聞く】「兼業農家」とLINEにありました。いまも別のお仕事がありますか。\n（稲作40アールは「自家用と考えますので、変えようがないです」＝原文。今日は畑の20アールの話にする）"},{"k":"これから","h":"内藤さんは、どうなっていきたいですか","quote":"「体力に負担の少ない営農で単収を確保したい。」","sub":"露地野菜で年150万円の売上","note":"【聞く】ご相談に来ていただいたということは前向きだと思うんですけども、内藤さんご自身は、これからどのようにやっていきたいとお考えですか。\n【聞く】「体力に負担の少ない」は、今いちばん体にこたえる作業でいうと何ですか。\n【聞く】150万円は何年目くらいで届けたいですか。\n（原文＝「現状でもいいですが年齢を考慮した作業で、路地野菜で150万円売上を目標にしてます。」）"},{"k":"今の実績","h":"昨年、産直で110万円を売りました","sub":"令和7年・露地野菜20品目・地元の産直へ","note":"【聞く】110万円の中で、売上が大きかった品目を3つ教えてください。\n【聞く】LINEでは「前年の売り上げは160万円の規模」と書いてくださいました。シートの110万円との違いは、お米や別の売り先の分ですか。\n【褒める】70歳で、20品目を切らさずに産直へ出して110万円。ここはまず受け止めて褒める（小野さんには「これ出せてるの素晴らしいですね」「大変頑張ってらっしゃるなと思います」と言った。感想で「『頑張ってる！』と褒めて頂き」がいちばん効いた）"},{"cls":"compact","k":"一宮市の農業","h":"一宮市の野菜は、15.8億円です","table":{"head":["一宮市","産出額","県内順位"],"rows":[["農業産出額 合計","58.0億円","18位"],["野菜","15.8億円","15位"],["なす","4.2億円","2位"],["だいこん","1.8億円","5位"],["はくさい","1.0億円","5位"]]},"src":"出典：農林水産省 令和6年 市町村別農業産出額（推計）","note":"【話す】内藤さんの一宮市を、僕の方で調べました。野菜全体の売上が15億8千万円あります。その中で、なすが4億2千万円で愛知県の2位。全国でも33位です。だいこんとはくさいも県内5位です。\n【聞く】20品目の中に、なす・だいこん・はくさいは入っていますか。\n【聞かれたら】一宮市のほか＝米23.0億円（県内6位）／トマト1.3億円（13位）／花き4.2億円（13位）／かんしょ0.4億円（5位）／キャベツ0.2億円（20位）／にんじん0.1億円（18位）。\n【聞かれたら】一宮市にはJA愛知西の産直広場があり、南小渕店は2019年3月に開いたJA愛知西でいちばん大きい店（出どころ＝JA愛知西のページ ja-aichinishi.or.jp/sanchoku/）。内藤さんの卸し先がどこの産直かは当日聞く。\n【出典】農林水産省 令和6年 市町村別農業産出額（推計）詳細品目別データ。"},{"k":"最初に","h":"今日、先に答えを出したいのはどちらですか","choices":[["A　品目を決める","何を主力にするか"],["B　体に負担の少ないやり方","1日4時間で回す形"]],"note":"【聞く】予約の時に「3. 1反で利益」を選んでくださいました。今日いちばん先に答えを出したいのは、Aですか、Bですか。\n【待つ】本人が選ぶ。どちらを選んでも、両方に触れて終わる。"},{"k":"作る物","h":"今、畑には何がありますか","sub":"季節の野菜20品目・地元の産直へ","note":"【聞く】今の20品目を、春夏と秋冬に分けて教えてください。\n【聞く】作っていて楽な物と、体にこたえる物はどれですか。\n【聞く】よく売れる物と、残ってしまう物はどれですか。\n（録音：小野さん 24:29〜 今の作付けを1つずつ聞いた）"},{"k":"イチロウの考え方","h":"見ているのは、売上じゃないんです","quote":"1作で、1反あたり いくら手元に残るか","note":"【話す】売り上げももちろん見ます。でも一番見ているのは売り上げじゃないんです。1作で一反あたりいくら手元に残るかです。苗の数も面積も、この数字から逆算します。\n（予約で選んだ「3. 1反で利益」と同じ話。動画の言葉＝ゲームチェンジのフロント動画 [6:44]〜[7:05]）"},{"k":"目標との距離","h":"年150万円。1反あたり、いくら売れれば届くと思いますか？","cls":"compact","big":"？ 万円 ／ 1反","note":"【聞く】先に答えを言わない。本人に言ってもらう。\n【待つ】出てきた数字は否定しない。"},{"k":"目標との距離","h":"1反あたり 約55万円 → 75万円","sub":"今　110万円÷2反\u003cbr>目標 150万円÷2反（畑20アール＝2反）","note":"【話す】畑は20アール、2反です。昨年の110万円は、1反あたり約55万円。目標の150万円は、1反あたり75万円です。\n【話す】面積は増やさない。同じ2反で、1反あたりの売上を上げて、それを毎年安定させる。内藤さんの「単収を確保したい」は、ここのことだと思います。\n【確認】110万円と150万円は、どちらも売上ですね。\n（計算は 110万円÷2反＝55万円／150万円÷2反＝75万円 だけ。栽培・単価の数字は足していない）"},{"k":"作る物の決め方","h":"売り先の「全体の売上」を見ます","sub":"卸している産直の、品目別・月別の売上","note":"【話す】作る物・作る量の決め方です。内藤さんが卸している産直で、何が、どの月に、いくら売れているかという数字があるんです。そこをもらうといいですね。\n【話す】例えばその産直のなす全体の売上が月40万円なら、そこに入る余地があるかが分かります。その月に千円しか売れていない物を5千円分作っても、売れないんです。\n【聞く】卸している産直に、品目別・月別の売上を聞けそうですか。\n（録音：小野さん 27:47〜31:05＝感想で「売り先で何が一番売り上げがあるのか調べる」がいちばん印象に残った所）"},{"k":"主力を決める","h":"売れている物を主力に、売れない物は作らない","choices":[["主力","産直で売上が大きい品目"],["減らす・やめる","売上が小さい品目（うちで食べる分だけ）"]],"note":"【話す】売上の上位を作っていくんです。今の20品目が上位に当てはまっていればいいんですが、そうでなければ、作るのをやめるか減らしましょう。品目が多いほど、毎日の作業が増えて、体にもこたえます。\n【話す】主力が決まると、作業の時間が測れるようになります。同じ1日4時間の中で、手が回る所が増えていきます。\n【聞く】20品目の中で、売上が小さいのに手間がかかっている物はどれですか。\n【話す】ステップとしては、販売明細をもらう、その数字から品目を選ぶ、できるだけパイの大きいもの。そうすると大体何個植えるか決まって、主力から時間が測れるようになります。"},{"k":"相談のあと","h":"内藤さん専用の「次の一手3選」を作ります","sub":"今日の話と感想をもとに、LINEでお送りします","note":"【話す】今日の話をもとに、2反で年150万円に向けて何をしていけばいいかの「次の一手3選」を作ります。感想フォームに、学べたことや、終わってみて疑問に残ったことを書いていただくと、しっかり見てお送りします。半月ほどかかる場合があります。少しお時間をください。\n（録音：小野さん 36:41〜 30分のあたりで3選を案内して、そのあと質問を受けた）"},{"k":"質問の時間","h":"聞きたいことを、全部聞いてください","sub":"品目・やり方・出荷・売り先、何でも大丈夫です","note":"【話す】30分たちましたが、質問があればどんどん聞いてください。全部お答えします。\n【聞く・待つ】ここは本人の質問に答える時間。内藤さんのシートの「やり方」はここで聞く（小野さんは苗の徒長・病気と予防・連作と2か所の畑の回し方・マルチなしを質問した）。\n★作り方・肥料・薬の数字は、イチロウが話した事だけを記録する。資料には数字を入れていない。"},{"k":"売り先のパイ","h":"「1反でいくら」の指標は、普及所とJAにあります","sub":"品目ごとの「1反あたり」の数字を見せてもらえます","note":"【話す】県の農業改良普及課という所があります。そこでは、例えばなすを一反作るとどれぐらいの売上になるか、という指標を持っています。誰でもその数字になるわけではありませんが、見せてもらうことができます。\n【話す】僕も花を始めたら、実は地域が日本一の市場だった。売上のパイがある所に入っていくのは、非常に大事だと実感しています。\n（録音：小野さん 52:05〜1:01:36）"},{"k":"目標の条件","h":"年150万円に近づく、3つの条件","steps":["品質を上げる","絶え間なく出す","売り先のパイに合わせる"],"note":"【話す】技術が上がって、絶え間なく出せて、売り先のランキングを知っていて、そこにきちっと出せるかどうか。この3つがそろうほど近づきます。品目を絞るほど、この3つに手が回るようになります。\n（録音：小野さん 1:02:19〜「2反でどれぐらい目指せるか」への答え。目標額を約束にしない）"},{"k":"背中を押します","h":"20品目を、毎年切らさずに出しています","sub":"1日4時間・ご家族と・地元の産直で110万円","note":"【話す】20品目を季節ごとに作って、地元の産直に切らさず出して、110万円。これは誰でもできることじゃないです。頑張ってらっしゃいます。\n【話す】あとは、どれを主力にするかだけです。産直の数字を見れば、体に負担の少ない形で、同じ2反から上を目指せます。"},{"k":"今週やる1つ","h":"まず、産直に聞いてみます","steps":["産直で売れている品目を聞く","自分の20品目の売上を並べる","主力を1つ選ぶ"],"note":"【聞く】今週やる1つは、どれにしますか。\n【待つ】決めるのは本人。\n（小野さんは感想で「直売所に聞いてみようと思います」と書いた＝この1つが持ち帰りやすい）"},{"k":"このあと","h":"特典③のご案内","sub":"今日の感想を書いてくださったら、内藤さん専用の「施策3選」をLINEでお送りします。\u003cbr>\u003cspan style=\"display:block;font-size:40px;margin-top:28px;color:#556052\">お作りするのに半月ほどかかる場合があります。少しお時間をください\u003c/span>","note":"【話す】今日の感想を書いてくださったら、内藤さん専用の「施策3選」をLINEでお送りします。しっかり考えてお作りするので、半月ほどかかる場合があります。少しお時間をください。\n（金井さん・松本さんの回と同じ案内。出どころ＝部署_UTAGEちゃん/haishin-bunsho/knowledge/確定_正解の見本_三上さんに送った流れ_20260803.md「相談会 → 感想フォーム案内 → 特典③」）"},{"k":"感想フォーム","h":"次の一手を作るための、最後の材料です","sub":"引っかかった事・聞きそびれた事を書いてください","note":"【話す】このあと感想フォームが届きます。書いていただかないと次の3選が作れませんので、いろんなこと書いてください。届かなかった時は、LINEにそのまま書いていただいて大丈夫です。\n【閉じる】今日はありがとうございました。"}];
const stage=document.getElementById('stage');
S.forEach((s)=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');let x='';if(s.k)x+=`<div class="kicker">${s.k}</div>`;x+=`<h1>${s.h}</h1>`;if(s.quote)x+=`<div class="quote">${s.quote}</div>`;if(s.big)x+=`<div class="bigq">${s.big}</div>`;if(s.sub)x+=`<div class="sub ${s.subCls||''}">${s.sub}</div>`;if(s.table)x+=`<table class="tbl ${s.table.cls||''}"><tr>${s.table.head.map(v=>`<th>${v}</th>`).join('')}</tr>${s.table.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;if(s.src)x+=`<div class="src">${s.src}</div>`;if(s.choices)x+='<div class="choices">'+s.choices.map(v=>`<div class="choice"><strong>${v[0]}</strong><span>${v[1]}</span></div>`).join('')+'</div>';if(s.steps)x+=`<div class="steps ${s.stepsCls||''}">`+s.steps.map((v,i)=>`${i?'<div class="arrow">→</div>':''}<div class="step">${v}</div>`).join('')+'</div>';if(s.tag)x+=`<div class="tag">${s.tag}</div>`;d.innerHTML=x;d.dataset.note=s.note;stage.appendChild(d)});
let cur=0;const slides=[...document.querySelectorAll('.slide')];function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle('active',n===cur));location.hash=String(cur)}
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))show(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});stage.addEventListener('click',()=>show(cur+1));
function fit(){const z=Math.min(innerWidth/1600,innerHeight/900);slides.forEach(s=>s.style.zoom=z)}addEventListener('resize',fit);const n=parseInt((location.hash||'#0').slice(1),10);show(Number.isFinite(n)?n:0);fit();
</script>

<nav id="controls"><button id="previous">前へ</button><button id="next">次へ</button><button id="fullscreen">全画面</button></nav>
<script>
const previousButton=document.getElementById('previous'),nextButton=document.getElementById('next'),fullscreenButton=document.getElementById('fullscreen');
function updateButtons(){previousButton.disabled=cur===0;nextButton.disabled=cur===slides.length-1}
previousButton.onclick=()=>{show(cur-1);updateButtons()};nextButton.onclick=()=>{show(cur+1);updateButtons()};
fullscreenButton.onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()};
document.addEventListener('fullscreenchange',()=>fullscreenButton.textContent=document.fullscreenElement?'全画面を終了':'全画面');
let controlsTimer;function revealControls(){document.body.classList.add('controls-visible');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>document.body.classList.remove('controls-visible'),2000)}
document.addEventListener('pointermove',revealControls);document.addEventListener('focusin',revealControls);document.addEventListener('keydown',updateButtons);stage.addEventListener('click',updateButtons);updateButtons();revealControls();
</script></body>
